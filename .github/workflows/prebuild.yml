# Builds the native kernels (native/kernels.cc) for every platform the
# package ships a prebuild for, tests each binary on its own platform, and
# collects them into one `prebuilds` artifact in the layout
# lib/nativeKernels.js loads from, with the manifest it checks them
# against:
#
#   prebuilds/<platform>-<arch>/vision-kernels[.glibc|.musl].node
#   prebuilds/manifest.json
#
# It builds and tests only. Nothing is committed or published from here:
# the binaries go into the package by hand, from the `prebuilds` artifact.
# The Linux ones are built in images pinned by digest
# (native/prebuild-linux.sh), so the same source gives the same bytes:
# the linux-x64 jobs fail when a rebuild differs from the committed binary.
#
# This workflow has not been run yet. It was written from the documentation
# of the runners, the actions and the images it uses; expect the first run
# to need fixes.

name: prebuild

on:
  workflow_dispatch:
  # A tag push ignores the path filter, so every release tag builds.
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "native/**"
      - "prebuilds/**"
      - "lib/nativeKernels.js"
      - "lib/poolWorker.js"
      - "lib/pool.js"
      - "lib/parallel.js"
      - "lib/compare.js"
      - "test/nativeKernels*.test.js"
      - "test/nativePipeline.test.js"
      - "test/overlay.test.js"
      - "test/helpers/kernelCases.js"
      - ".github/workflows/prebuild.yml"
  pull_request:
    paths:
      - "native/**"
      - "prebuilds/**"
      - "lib/nativeKernels.js"
      - "lib/poolWorker.js"
      - "lib/pool.js"
      - "lib/parallel.js"
      - "lib/compare.js"
      - "test/nativeKernels*.test.js"
      - "test/nativePipeline.test.js"
      - "test/overlay.test.js"
      - "test/helpers/kernelCases.js"
      - ".github/workflows/prebuild.yml"

permissions:
  contents: read

env:
  # More random dispatches per kernel than the default 40 a local run gets
  VISION_TOOLS_FUZZ_ROUNDS: "400"
  # Fails the job when the binary just built did not load: the native
  # tests skip themselves where it does not, and would pass
  NATIVE_CHECK: >-
    const s = require('./lib/nativeKernels.js').status();
    console.log(s);
    if (!s.native) process.exit(1);
  NATIVE_TESTS: test/nativeKernels.test.js test/nativeKernelsLoader.test.js test/nativePipeline.test.js test/overlay.test.js

defaults:
  run:
    # bash on Windows too, so the steps read the same everywhere
    shell: bash

jobs:
  linux:
    name: linux-${{ matrix.arch }} (${{ matrix.libc }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, libc: glibc, runner: ubuntu-24.04 }
          - { arch: x64, libc: musl, runner: ubuntu-24.04 }
          - { arch: arm64, libc: glibc, runner: ubuntu-24.04-arm }
          - { arch: arm64, libc: musl, runner: ubuntu-24.04-arm }
    env:
      OUT: prebuilds/linux-${{ matrix.arch }}/vision-kernels.${{ matrix.libc }}.node
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Check the runner is the arch being built
        run: test "$(node -p 'process.platform + "-" + process.arch')" = "linux-${{ matrix.arch }}"

      # manylinux2014 (glibc 2.17) is CentOS 7, past its end of life; it is
      # kept because a binary built against 2.17 loads on every glibc since.
      # musllinux_1_2 for musl. Both pinned by digest in the script, with
      # the node-api-headers it compiles against.
      - name: Build in the pinned image
        run: |
          rm -f "$OUT"
          sh native/prebuild-linux.sh ${{ matrix.arch }} ${{ matrix.libc }}
          ls -l "$OUT"

      # The shipped ones: the same source must give the same bytes
      - name: Check the rebuild is the committed binary
        if: matrix.arch == 'x64'
        run: node native/manifest.js --check "$OUT"

      - name: Check no symbol needs a glibc newer than 2.17
        if: matrix.libc == 'glibc'
        run: |
          v=$(objdump -T "$OUT" | grep -o 'GLIBC_[0-9.]*' | sed 's/^GLIBC_//' | sort -uV | tail -1)
          echo "highest glibc symbol version: ${v:-none}"
          top=$(printf '%s\n2.17\n' "$v" | sort -V | tail -1)
          if [ "$top" != "2.17" ]; then
            echo "::error::$OUT needs glibc $v, newer than 2.17"
            exit 1
          fi

      # The loader checks every prebuild against the manifest, so the one
      # just built must be in it
      - name: List the binaries in the manifest
        run: node native/manifest.js > /dev/null

      # Not npm ci: see the README. sharp's platform binaries are optional
      # dependencies, so nothing optional is left out either.
      - name: Test on the host (glibc)
        if: matrix.libc == 'glibc'
        run: |
          npm install --no-audit --no-fund
          node -e "$NATIVE_CHECK"
          node --test $NATIVE_TESTS

      # The whole suite once, on one platform, with each set of kernels
      - name: Whole suite, native kernels
        if: matrix.arch == 'x64' && matrix.libc == 'glibc'
        run: npm test

      - name: Whole suite, JS kernels
        if: matrix.arch == 'x64' && matrix.libc == 'glibc'
        run: npm test
        env:
          VISION_TOOLS_KERNELS: js

      # docker run rather than a `container:` job: the runner's JavaScript
      # actions need a glibc Node, which an Alpine container does not have.
      - name: Test in node:22-alpine (musl)
        if: matrix.libc == 'musl'
        run: |
          docker run --rm -v "$PWD:/w" -w /w \
            -e NATIVE_CHECK -e NATIVE_TESTS -e VISION_TOOLS_FUZZ_ROUNDS \
            node:22-alpine sh -c '
              set -e
              test "$(node -p "process.platform + \"-\" + process.arch")" = "linux-${{ matrix.arch }}"
              npm install --no-audit --no-fund
              node -e "$NATIVE_CHECK"
              node --test $NATIVE_TESTS
            '

      # This job's binary alone, at its place under prebuilds/
      - name: Stage the binary
        run: mkdir -p "dist/$(dirname "$OUT")" && cp "$OUT" "dist/$OUT"

      - uses: actions/upload-artifact@v7
        with:
          name: prebuild-linux-${{ matrix.arch }}-${{ matrix.libc }}
          path: dist/prebuilds/
          if-no-files-found: error

  windows:
    name: win32-x64
    # windows-2025 now carries Visual Studio 2026; node-gyp finds it from
    # 12.1 on, so the version is pinned
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      OUT: prebuilds/win32-x64/vision-kernels.node
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Check the runner is the arch being built
        run: test "$(node -p 'process.platform + "-" + process.arch')" = "win32-x64"

      # binding.gyp carries build.sh's flags; MSVC has no FMA contraction
      # at /fp:precise
      - name: Build with node-gyp
        run: |
          rm -rf "$OUT" native/build
          (cd native && npx --yes node-gyp@12.4.0 rebuild)
          mkdir -p "$(dirname "$OUT")"
          cp native/build/Release/vision_kernels.node "$OUT"
          rm -rf native/build
          ls -l "$OUT"
          node native/manifest.js > /dev/null

      - run: npm install --no-audit --no-fund

      - name: Check the prebuild loads
        run: node -e "$NATIVE_CHECK"

      - name: Native kernel tests
        run: node --test $NATIVE_TESTS

      - name: Stage the binary
        run: mkdir -p "dist/$(dirname "$OUT")" && cp "$OUT" "dist/$OUT"

      - uses: actions/upload-artifact@v7
        with:
          name: prebuild-win32-x64
          path: dist/prebuilds/
          if-no-files-found: error

  macos:
    name: darwin-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          # the last Intel macOS image GitHub hosts in this line
          - arch: x64
            runner: macos-15-intel
    env:
      OUT: prebuilds/darwin-${{ matrix.arch }}/vision-kernels.node
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Check the runner is the arch being built
        run: test "$(node -p 'process.platform + "-" + process.arch')" = "darwin-${{ matrix.arch }}"

      # build.sh targets macOS 11 and leaves N-API's symbols to the node
      # binary that loads the addon
      - name: Build
        run: |
          rm -f "$OUT"
          mkdir -p "$(dirname "$OUT")"
          sh native/build.sh "$OUT" "$(dirname "$(dirname "$(which node)")")/include/node"
          node native/manifest.js > /dev/null

      - run: npm install --no-audit --no-fund

      - name: Check the prebuild loads
        run: node -e "$NATIVE_CHECK"

      - name: Native kernel tests
        run: node --test $NATIVE_TESTS

      - name: Stage the binary
        run: mkdir -p "dist/$(dirname "$OUT")" && cp "$OUT" "dist/$OUT"

      - uses: actions/upload-artifact@v7
        with:
          name: prebuild-darwin-${{ matrix.arch }}
          path: dist/prebuilds/
          if-no-files-found: error

  collect:
    name: collect prebuilds
    needs: [linux, windows, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Each artifact holds <platform>-<arch>/<file>, so merging them into
      # one directory gives the package's prebuilds/ back.
      - uses: actions/download-artifact@v8
        with:
          pattern: prebuild-*
          merge-multiple: true
          path: dist/prebuilds

      - name: Check all seven are there, and write their manifest
        run: |
          missing=0
          for f in \
            linux-x64/vision-kernels.glibc.node \
            linux-x64/vision-kernels.musl.node \
            linux-arm64/vision-kernels.glibc.node \
            linux-arm64/vision-kernels.musl.node \
            win32-x64/vision-kernels.node \
            darwin-arm64/vision-kernels.node \
            darwin-x64/vision-kernels.node
          do
            if [ ! -s "dist/prebuilds/$f" ]; then
              echo "::error::missing prebuilds/$f"
              missing=1
            fi
          done
          [ $missing = 0 ] || exit 1
          node native/manifest.js dist/prebuilds

      # Uploaded from dist/, so the artifact unpacks to prebuilds/... at
      # the package root.
      - uses: actions/upload-artifact@v7
        with:
          name: prebuilds
          path: dist/
          if-no-files-found: error
