          vctx.scale(view.scale, view.scale);
          // past 4x the interesting question is "what does one pixel say",
          // so stop blurring them together
          vctx.imageSmoothingEnabled = view.scale < 4;
          vctx.imageSmoothingQuality = "high";
          vctx.drawImage(image, 0, 0, imageW, imageH);
          vctx.restore();

          // the frame's own border, so a region hanging off the edge is obvious
          const tl = toScreen(0, 0);
          const br = toScreen(imageW, imageH);
          vctx.strokeStyle = "rgba(255,255,255,0.25)";
          vctx.lineWidth = 1;
          vctx.strokeRect(tl.x, tl.y, br.x - tl.x, br.y - tl.y);

          drawRegions(vctx, vregs, vsel, toScreen, {
            geometry: reg,
            scan: scan,
            showCalipers: showCalipers,
          });
          drawRunResult(vctx, toScreen);

          // resize handles and the rotation grip
          const pts = handlePoints();
          for (const p of pts) {
            vctx.fillStyle = "#ffffff";
            vctx.fillRect(p.x - HANDLE, p.y - HANDLE, HANDLE * 2, HANDLE * 2);
            vctx.strokeStyle = "#2196f3";
            vctx.lineWidth = 1.5;
            vctx.strokeRect(p.x - HANDLE, p.y - HANDLE, HANDLE * 2, HANDLE * 2);
          }
          const rp = rotatePoint();
          const cs = toScreen(reg.x + reg.width / 2, reg.y + reg.height / 2);
          vctx.strokeStyle = "rgba(255,255,255,0.5)";
          vctx.lineWidth = 1;
          vctx.setLineDash([3, 3]);
          vctx.beginPath();
          vctx.moveTo(cs.x, cs.y);
          vctx.lineTo(rp.x, rp.y);
          vctx.stroke();
          vctx.setLineDash([]);
          vctx.beginPath();
          vctx.arc(rp.x, rp.y, 6, 0, Math.PI * 2);
          vctx.fillStyle = "#ffb300";
          vctx.fill();
          vctx.strokeStyle = "#7a4f00";
          vctx.stroke();
        };

        const updateFootReadout = function () {
          imgInfo.textContent = imageW + " × " + imageH + " px";
          let txt = "zoom " + Math.round(view.scale * 100) + "%  ·  " +
            (vregs.length > 1 ? vregs[vsel].name + ":  " : "") +
            describeRegion(reg, scan);
          if (outsideFrame(reg, scan)) {
            txt += "  ·  ⚠ past the frame: bands outside it are skipped";
          }
          footReadout.textContent = txt;
        };

        const repaint = function () {
          drawView();
          updateFootReadout();
        };

        // ---- pointer -------------------------------------------------
        let drag = null;
        viewCanvas.addEventListener("pointerdown", function (ev) {
          if (ev.button !== 0 && ev.button !== 2) return;
          viewCanvas.setPointerCapture(ev.pointerId);
          const b = viewCanvas.getBoundingClientRect();
          const sx = ev.clientX - b.left;
          const sy = ev.clientY - b.top;
          const p = toImage(ev);
          if (ev.button === 2 || mode === "pan") {
            drag = { type: "pan", sx: sx, sy: sy, ox: view.ox, oy: view.oy };
          } else if (hitRotate(sx, sy)) {
            drag = { type: "rotate" };
          } else {
            const handleIndex = hitHandle(sx, sy);
            if (handleIndex >= 0) {
              drag = { type: "handle", handle: handleIndex };
            } else if (inside(p.x, p.y)) {
              drag = { type: "move", ix: p.x, iy: p.y, start: reg };
            } else if (hitOtherRegion(p.x, p.y) >= 0) {
              // a click on another region selects it; nothing is dragged
              selectInViewer(hitOtherRegion(p.x, p.y));
              drag = null;
              repaint();
            } else {
              drag = { type: "new", from: p, prev: reg, prevScan: scan };
            }
          }
          ev.preventDefault();
        });
        viewCanvas.addEventListener("pointermove", function (ev) {
          if (!drag) {
            return;
          }
          const b = viewCanvas.getBoundingClientRect();
          const sx = ev.clientX - b.left;
          const sy = ev.clientY - b.top;
          const p = toImage(ev);
          if (drag.type === "pan") {
            view.ox = drag.ox + (sx - drag.sx);
            view.oy = drag.oy + (sy - drag.sy);
          } else if (drag.type === "new") {
            reg = newRegionFromDrag(drag.from, p);
            btnScan.textContent = "Scan " + SCAN_ARROW[scan];
          } else if (drag.type === "move") {
            reg = {
              x: drag.start.x + (p.x - drag.ix),
              y: drag.start.y + (p.y - drag.iy),
              width: drag.start.width,
              height: drag.start.height,
              angleDeg: drag.start.angleDeg,
            };
          } else if (drag.type === "handle") {
            reg = resizeByHandle(drag.handle, p.x, p.y);
          } else if (drag.type === "rotate") {
            const cx = reg.x + reg.width / 2;
            const cy = reg.y + reg.height / 2;
            let deg = (Math.atan2(p.y - cy, p.x - cx) * 180) / Math.PI;
            // shift snaps to 5 degrees; otherwise a tenth, which is the
            // finest the field carries
            deg = ev.shiftKey ? Math.round(deg / 5) * 5 : Math.round(deg * 10) / 10;
            reg = { x: reg.x, y: reg.y, width: reg.width, height: reg.height, angleDeg: deg };
          }
          repaint();
        });
        const endDrag = function () {
          if (!drag) return;
          if (drag.type === "new" && (reg.width <= MIN_SIDE || reg.height <= MIN_SIDE)) {
            // a click rather than a drag: keep what was there
            reg = drag.prev;
            scan = drag.prevScan;
            btnScan.textContent = "Scan " + SCAN_ARROW[scan];
          }
          drag = null;
          repaint();
        };
        viewCanvas.addEventListener("pointerup", endDrag);
        viewCanvas.addEventListener("pointercancel", endDrag);
        viewCanvas.addEventListener("contextmenu", function (ev) {
          ev.preventDefault();
        });
        viewCanvas.addEventListener(
          "wheel",
          function (ev) {
            ev.preventDefault();
            const b = viewCanvas.getBoundingClientRect();
            zoomAt(ev.clientX - b.left, ev.clientY - b.top, ev.deltaY < 0 ? 1.25 : 0.8);
            repaint();
          },
          { passive: false },
        );

        // ---- window plumbing -----------------------------------------
        const setViewSize = function () {
          viewCanvas.width = Math.round(body.clientWidth * dpr);
          viewCanvas.height = Math.round(body.clientHeight * dpr);
          vctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          repaint();
        };
        const closeViewer = function () {
          if (!viewer) return;
          window.removeEventListener("keydown", onKeyDown, true);
          window.removeEventListener("resize", onResize);
          overlay.remove();
          viewer = null;
        };
        const nudge = function (dx, dy) {
          reg = {
            x: reg.x + dx,
            y: reg.y + dy,
            width: reg.width,
            height: reg.height,
            angleDeg: reg.angleDeg,
          };
          repaint();
        };
        const onKeyDown = function (ev) {
          if (ev.key === "Escape") {
            ev.preventDefault();
            ev.stopPropagation();
            closeViewer();
            return;
          }
          const step = ev.shiftKey ? 10 : 1;
          if (ev.key === "ArrowLeft") nudge(-step, 0);
          else if (ev.key === "ArrowRight") nudge(step, 0);
          else if (ev.key === "ArrowUp") nudge(0, -step);
          else if (ev.key === "ArrowDown") nudge(0, step);
          else if (
            ev.key === "Enter" &&
            !(ev.target && ev.target instanceof Element && overlay.contains(ev.target))
          ) {
            // keep Enter from saving the whole edit dialog behind the modal
            ev.preventDefault();
            ev.stopPropagation();
            return;
          } else {
            return;
          }
          ev.preventDefault();
          ev.stopPropagation();
        };
        const onResize = function () {
          setViewSize();
        };

        btnZoomIn.addEventListener("click", function () {
          zoomAt(body.clientWidth / 2, body.clientHeight / 2, 1.5);
          repaint();
        });
        btnZoomOut.addEventListener("click", function () {
          zoomAt(body.clientWidth / 2, body.clientHeight / 2, 1 / 1.5);
          repaint();
        });
        btnFit.addEventListener("click", function () {
          fitView();
          repaint();
        });
        btn100.addEventListener("click", function () {
          view.scale = 1;
          view.ox = (body.clientWidth - imageW) / 2;
          view.oy = (body.clientHeight - imageH) / 2;
          repaint();
        });
        btnMode.addEventListener("click", function () {
          mode = mode === "draw" ? "pan" : "draw";
          btnMode.textContent = "Mode: " + (mode === "draw" ? "Draw" : "Pan");
          btnMode.title =
            mode === "draw"
              ? "Drag to draw the region; right-drag pans"
              : "Drag to pan the image; switch back to Draw to edit the region";
          viewCanvas.style.cursor = mode === "draw" ? "crosshair" : "grab";
        });
        btnScan.addEventListener("click", function () {
          scan = SCAN_ORDER[(SCAN_ORDER.indexOf(scan) + 1) % SCAN_ORDER.length];
          btnScan.textContent = "Scan " + SCAN_ARROW[scan];
          repaint();
        });
        btnCalipers.addEventListener("click", function () {
          showCalipers = !showCalipers;
          btnCalipers.style.opacity = showCalipers ? "1" : "0.55";
          repaint();
        });
        btnClose.addEventListener("click", closeViewer);
        btnCancel.addEventListener("click", closeViewer);
        btnApply.addEventListener("click", function () {
          syncSel();
          regions = vregs;
          lineFinderEditingRegions = regions;
          selected = vsel;
          lineFinderEditingSelected = vsel;
          writeFields(regions[selected]);
          renderList();
          clearRun();
          updateReadout();
          drawThumb();
          closeViewer();
        });

        window.addEventListener("keydown", onKeyDown, true);
        window.addEventListener("resize", onResize);
        overlay.addEventListener(
          "wheel",
          function (ev) {
            ev.preventDefault();
          },
          { passive: false },
        );

        // open zoomed to the region when there is one worth looking at: the
        // whole point of the viewer is the pixels at the edge
        fitView();
        if (hasRegion(reg) && imageW) {
          const f = regionFrameEditor(reg, scan);
          const want = Math.min(
            body.clientWidth / Math.max(20, reg.width * 1.6),
            body.clientHeight / Math.max(20, reg.height * 1.6),
          );
          if (Number.isFinite(want) && want > view.scale) {
            view.scale = clamp(want, view.scale, 8);
            view.ox = body.clientWidth / 2 - f.centre.x * view.scale;
            view.oy = body.clientHeight / 2 - f.centre.y * view.scale;
          }
        }
        setViewSize();
        btnApply.focus();
      };

      // ---- wiring ----------------------------------------------------
      // a click on the thumbnail selects the region under it when that is
      // not the selected one, and opens the viewer otherwise
      canvas.addEventListener("click", function (ev) {
        if (image && regions.length > 1 && ev && Number.isFinite(ev.clientX)) {
          const b = canvas.getBoundingClientRect();
          const f = fit();
          const sx = ((ev.clientX - b.left) * canvas.width) / (b.width || canvas.width);
          const sy = ((ev.clientY - b.top) * canvas.height) / (b.height || canvas.height);
          const px = (sx - f.dx) / f.s;
          const py = (sy - f.dy) / f.s;
          for (let i = 0; i < regions.length; i++) {
            if (i !== selected && insideRegion(regions[i], px, py)) {
              commitFields();
              selectRegion(i);
              return;
            }
          }
        }
        openViewer();
      });
      document
        .getElementById("line-finder-open-viewer")
        .addEventListener("click", openViewer);

      const releaseUrl = function () {
        if (imageUrl) URL.revokeObjectURL(imageUrl);
        imageUrl = null;
      };
      lineFinderEditingRelease = releaseUrl;
      /**
       * Decode a Blob (a chosen file or the fetched frame) into the image
       * the thumbnail, viewer and Run all work from. `onLoaded` runs once
       * it is in; a frame that fails to decode is reported and leaves the
       * current image alone.
       */
      const loadBlob = function (blob, source, onLoaded) {
        releaseUrl();
        const url = URL.createObjectURL(blob);
        imageUrl = url;
        const img = new Image();
        img.onload = function () {
          if (imageUrl === url) imageUrl = null;
          URL.revokeObjectURL(url);
          image = img;
          imageW = img.naturalWidth;
          imageH = img.naturalHeight;
          imageSource = source;
          clearRun();
          runButton.disabled = false;
          updateReadout();
          drawThumb();
          if (onLoaded) onLoaded();
        };
        img.onerror = function () {
          if (imageUrl === url) imageUrl = null;
          URL.revokeObjectURL(url);
          RED.notify("line-finder: could not read that image", "error");
        };
        img.src = url;
      };

      // ---- the node's own last frame -----------------------------------
      const NO_FRAME_CAPTION = "no frame yet - deploy and send one, or choose a file";
      const setFrameCaption = function (text) {
        frameCaption.textContent = text;
      };
      /**
       * Ask the runtime for the last frame through this node and load it
       * as the sample. A node that has never been deployed has an id but
       * no frame, and that is a quiet 404 - the dialog then works from a
       * file exactly as it did before. jQuery's ajax so the editor's own
       * auth header goes with the request; the response is a Blob.
       */
      const fetchLastFrame = function () {
        if (typeof $ === "undefined" || !$ || typeof $.ajax !== "function") return;
        setFrameCaption("fetching the last frame…");
        $.ajax({
          url: "line-finder/last-frame/" + node.id,
          type: "GET",
          cache: false,
          xhrFields: { responseType: "blob" },
        })
          .done(function (blob, _status, xhr) {
            if (!blob || typeof blob !== "object") {
              setFrameCaption(NO_FRAME_CAPTION);
              return;
            }
            const header = function (name) {
              return xhr && typeof xhr.getResponseHeader === "function" ? xhr.getResponseHeader(name) : null;
            };
            const w = Number(header("X-Frame-Width"));
            const h = Number(header("X-Frame-Height"));
            const received = Date.parse(header("X-Frame-Received"));
            loadBlob(blob, "cached", function () {
              const age = relativeTimeEditor(received, Date.now());
              setFrameCaption(
                "last frame through this node" +
                  (age ? ", " + age : "") +
                  " (" + (w || imageW) + "×" + (h || imageH) + ")",
              );
            });
          })
          .fail(function () {
            if (image && imageSource === "cached") {
              // The runtime lost its copy (restarted?) but the dialog still
              // has the frame: Run falls back to uploading what is shown.
              imageSource = "file";
              setFrameCaption("runtime has no frame yet - Run will upload the image shown");
              return;
            }
            setFrameCaption(NO_FRAME_CAPTION);
          });
      };
      reloadButton.addEventListener("click", fetchLastFrame);

      fileInput.addEventListener("change", function () {
        const file = fileInput.files && fileInput.files[0];
        if (!file) return;
        loadBlob(file, "file", function () {
          setFrameCaption("sample from " + (file.name || "a file"));
          openViewer();
        });
      });

      document
        .getElementById("line-finder-clear")
        .addEventListener("click", function () {
          writeRegion(
            { x: 0, y: 0, width: 100, height: 100, angleDeg: 0 },
            currentScan(),
          );
          commitFields();
          clearRun();
          updateReadout();
          drawThumb();
        });

      runButton.addEventListener("click", runOnImage);
      runButton.disabled = true;

      addButton.addEventListener("click", function () {
        commitFields();
        const size = 100;
        regions.push(
          normalizeRegionEditor({
            name: uniqueName("line", -1),
            x: imageW ? Math.round(imageW / 2 - size / 2) : 0,
            y: imageH ? Math.round(imageH / 2 - size / 2) : 0,
            width: size,
            height: size,
            angleDeg: 0,
            scanDirection: currentScan(),
            polarity: field("polarity").value,
            edgeSelect: field("edgeSelect").value,
          }),
        );
        clearRun();
        selectRegion(regions.length - 1);
      });
      removeButton.addEventListener("click", function () {
        if (regions.length <= 1) return;
        regions.splice(selected, 1);
        clearRun();
        selectRegion(Math.min(selected, regions.length - 1));
      });
      addRectButton.addEventListener("click", function () {
        commitFields();
        regions = mergeRectangleEditor(regions, rectangleRegionsEditor(imageW, imageH));
        lineFinderEditingRegions = regions;
        clearRun();
        selectRegion(
          regions.findIndex(function (r) {
            return r.name === "left";
          }),
        );
      });
      copyButton.addEventListener("click", copyEdgeRegions);

      // a result belongs to the regions it was run on: moving one or
      // changing the caliper count makes it stale, so it goes
      for (const id of [
        "regionX",
        "regionY",
        "regionWidth",
        "regionHeight",
        "regionAngleDeg",
        "scanDirection",
        "polarity",
        "edgeSelect",
      ]) {
        field(id).addEventListener("change", function () {
          commitFields();
          clearRun();
          updateReadout();
          drawThumb();
        });
      }
      for (const type of ["change", "input"]) {
        nameField.addEventListener(type, function () {
          commitFields();
          updateReadout();
          drawThumb();
        });
      }
      field("calipers").addEventListener("change", function () {
        clearRun();
        updateReadout();
        drawThumb();
      });

      // preview width only means anything when the preview is on
      const previewCheckbox = document.getElementById("node-input-previewEnabled");
      const previewWidthRow = document.getElementById("line-finder-preview-width-row");
      const updatePreviewVisibility = function () {
        previewWidthRow.style.display = previewCheckbox.checked ? "" : "none";
      };
      previewCheckbox.addEventListener("change", updatePreviewVisibility);
      updatePreviewVisibility();

      writeFields(regions[selected]);
      renderList();
      updateReadout();
      drawThumb();
      fetchLastFrame();
    },
    oneditsave: function () {
      if (lineFinderEditingRelease) lineFinderEditingRelease();
      lineFinderEditingRelease = null;
      const list = lineFinderEditingRegions;
      lineFinderEditingRegions = null;
      if (!Array.isArray(list)) return;
      // the fields hold the selected entry and may have been typed into
      // without a change event firing yet
      const sel = list[lineFinderEditingSelected];
      if (sel) {
        const read = function (id, fallback) {
          const el = document.getElementById("node-input-" + id);
          const v = el ? parseFloat(el.value) : NaN;
          return Number.isFinite(v) ? v : fallback;
        };
        const pick = function (id, fallback) {
          const el = document.getElementById("node-input-" + id);
          return el && el.value ? el.value : fallback;
        };
        const nameEl = document.getElementById("line-finder-region-name");
        sel.name = (nameEl && String(nameEl.value).trim()) || sel.name;
        sel.x = read("regionX", sel.x);
        sel.y = read("regionY", sel.y);
        sel.width = Math.max(1, read("regionWidth", sel.width));
        sel.height = Math.max(1, read("regionHeight", sel.height));
        sel.angleDeg = read("regionAngleDeg", sel.angleDeg);
        sel.scanDirection = pick("scanDirection", sel.scanDirection);
        sel.polarity = pick("polarity", sel.polarity);
        sel.edgeSelect = pick("edgeSelect", sel.edgeSelect);
      }
      this.regions = list.map(function (r) {
        return {
          name: r.name,
          x: r.x,
          y: r.y,
          width: r.width,
          height: r.height,
          angleDeg: r.angleDeg,
          scanDirection: r.scanDirection,
          polarity: r.polarity,
          edgeSelect: r.edgeSelect,
        };
      });
    },
    oneditcancel: function () {
      if (lineFinderEditingRelease) lineFinderEditingRelease();
      lineFinderEditingRelease = null;
      lineFinderEditingRegions = null;
    },
  });

  // ---- flow-canvas preview -----------------------------------------
  // One subscription for every line-finder node, registered once. The
  // overlay is drawn from image-pixel coordinates scaled to the
  // thumbnail, so a rotated region shows as the parallelogram it is
  // rather than as a misleading upright box. Every region in `lines` is
  // drawn; a runtime that sent only the single-region fields is read the
  // same way.
  if (!window.lineFinderPreviewRendererInitialized) {
    window.lineFinderPreviewRendererInitialized = true;

    const removePreview = function (nodeId) {
      const existing = document.getElementById(
        "line-finder-preview-container-" + nodeId,
      );
      if (existing) existing.remove();
    };

    RED.comms.subscribe("line-finder-preview", function (_event, data) {
      if (!data || !data.id) return;
      if (data.clear || !data.image) {
        removePreview(data.id);
        return;
      }
      const nodeElement = document.getElementById(data.id);
      if (!nodeElement) return;
      removePreview(data.id);

      const width = Number(data.previewWidth) || 260;
      const scale = width / data.imageWidth;
      const height = Math.round(data.imageHeight * scale);
      const lines =
        Array.isArray(data.lines) && data.lines.length
          ? data.lines
          : [{ name: "line", region: data.region, found: data.found, reason: data.reason,
              angleDeg: data.angleDeg, calipers: data.calipers, score: data.score,
              residualPx: data.residualPx, line: data.line, points: data.points }];

      const container = document.createElementNS(
        "http://www.w3.org/2000/svg",
        "foreignObject",
      );
      container.id = "line-finder-preview-container-" + data.id;
      container.setAttribute("x", "70");
      container.setAttribute("y", "5");
      container.setAttribute("width", String(width + 20));
      container.setAttribute("height", String(height + 46));
      container.style.overflow = "visible";

      const body = document.createElementNS("http://www.w3.org/1999/xhtml", "div");
      body.style.padding = "5px";
      body.style.background = "rgba(32, 32, 32, 0.9)";
      body.style.borderRadius = "4px";
      body.style.color = "white";
      body.style.font = "11px sans-serif";
      body.style.cursor = "pointer";
      body.title = "line-finder result (click to hide)";
      body.onclick = function () {
        removePreview(data.id);
      };

      const caption = document.createElementNS("http://www.w3.org/1999/xhtml", "div");
      caption.style.paddingBottom = "3px";
      caption.style.textAlign = "center";
      if (lines.length === 1) {
        const l = lines[0];
        caption.textContent = l.found
          ? l.angleDeg.toFixed(2) +
            "° · " + l.calipers.used + "/" + l.calipers.total +
            " · score " + l.score.toFixed(2) +
            " · resid " + l.residualPx.toFixed(2) + "px"
          : "not found (" + l.reason + ")";
      } else {
        caption.textContent =
          lines
            .map(function (l) {
              return l.found
                ? l.name + " ✓ " + Number(l.angleDeg).toFixed(1) + "°"
                : l.name + " ✗ " + l.reason;
            })
            .join(" · ") +
          (data.rect
            ? " · rect " + Math.round(data.rect.width) + "×" + Math.round(data.rect.height)
            : "");
      }
      caption.style.color = data.found ? "#a5d6a7" : "#ffcc80";

      const canvas = document.createElementNS("http://www.w3.org/1999/xhtml", "canvas");
      canvas.width = width;
      canvas.height = height;
      canvas.style.display = "block";
      canvas.style.width = width + "px";
      canvas.style.height = height + "px";

      const img = new Image();
      img.onload = function () {
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, width, height);
        const sx = function (v) { return v * scale; };

        for (const l of lines) {
          // the search region, as drawn
          if (Array.isArray(l.region) && l.region.length === 4) {
            ctx.strokeStyle = "#2196f3";
            ctx.lineWidth = 1;
            ctx.fillStyle = "rgba(33,150,243,0.15)";
            ctx.beginPath();
            ctx.moveTo(sx(l.region[0].x), sx(l.region[0].y));
            for (let i = 1; i < 4; i++) {
              ctx.lineTo(sx(l.region[i].x), sx(l.region[i].y));
            }
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
          }

          // every caliper hit: green kept, red dropped by the outlier trim
          for (const p of l.points || []) {
            ctx.fillStyle = p.used ? "#66bb6a" : "#ef5350";
            ctx.beginPath();
            ctx.arc(sx(p.x), sx(p.y), 1.8, 0, Math.PI * 2);
            ctx.fill();
          }

          // the fitted line
          if (l.line) {
            ctx.strokeStyle = "#ffeb3b";
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(sx(l.line.p0.x), sx(l.line.p0.y));
            ctx.lineTo(sx(l.line.p1.x), sx(l.line.p1.y));
            ctx.stroke();
          }
        }

        // the rectangle four sides made
        if (data.rect && Array.isArray(data.rect.corners) && data.rect.corners.length === 4) {
          const c = data.rect.corners;
          ctx.strokeStyle = "#00e5ff";
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.moveTo(sx(c[0].x), sx(c[0].y));
          for (let i = 1; i < 4; i++) ctx.lineTo(sx(c[i].x), sx(c[i].y));
          ctx.closePath();
          ctx.stroke();
          ctx.fillStyle = "#00e5ff";
          for (const p of c) {
            ctx.beginPath();
            ctx.arc(sx(p.x), sx(p.y), 2.5, 0, Math.PI * 2);
            ctx.fill();
          }
        }
      };
      img.src = "data:image/" + (data.mimeType || "jpeg") + ";base64," + data.image;

      body.appendChild(caption);
      body.appendChild(canvas);
      container.appendChild(body);
      nodeElement.appendChild(container);
    });
  }
</script>
