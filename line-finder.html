<script type="text/html" data-template-name="line-finder">
  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-input-name" placeholder="Name" />
  </div>

  <div class="form-row">
    <label><i class="fa fa-list"></i> Regions</label>
    <div style="margin-left:105px;">
      <div
        id="line-finder-region-list"
        style="border:1px solid #ccc; border-radius:3px; background:#fafafa; max-height:132px; overflow-y:auto; font-size:12px; font-family:monospace;"
        title="Click a region to select it; the fields below and the handles in the viewer edit the selected one"
      ></div>
      <div style="margin-top:6px;">
        <button
          type="button"
          id="line-finder-region-add"
          class="red-ui-button red-ui-button-small"
          title="Add a region"
        >
          <i class="fa fa-plus"></i> Add
        </button>
        <button
          type="button"
          id="line-finder-region-remove"
          class="red-ui-button red-ui-button-small"
          title="Remove the selected region"
        >
          <i class="fa fa-minus"></i> Remove
        </button>
        <button
          type="button"
          id="line-finder-add-rect"
          class="red-ui-button red-ui-button-small"
          title="Add left, right, top and bottom regions around the image centre, each scanning inwards (replacing any regions already so named)"
        >
          <i class="fa fa-square-o"></i> Add rectangle
        </button>
        <button
          type="button"
          id="line-finder-copy-edge-regions"
          class="red-ui-button red-ui-button-small"
          title="Copy the left/right/top/bottom regions and the tuning below as the edgeRegions JSON label-crop's calipers mode takes"
        >
          <i class="fa fa-clipboard"></i> Copy as label-crop edgeRegions
        </button>
      </div>
      <div style="margin-top:4px; color:#999; font-size:12px;">
        One region finds one edge. Name four of them <b>left</b>, <b>right</b>,
        <b>top</b> and <b>bottom</b> and the node also reports the rectangle
        they bound; <b>Add rectangle</b> lays those four out for you.
      </div>
    </div>
  </div>

  <div class="form-row">
    <label><i class="fa fa-crop"></i> Search region</label>
    <div style="margin-left:105px;">
      <canvas
        id="line-finder-canvas"
        width="360"
        height="240"
        style="border:1px solid #ccc; border-radius:3px; cursor:pointer; background:#fafafa;"
        title="Click to open the zoom viewer"
      ></canvas>
      <div style="margin-top:6px;">
        <input type="file" id="line-finder-file" accept="image/*" style="width:210px;" />
        <button
          type="button"
          id="line-finder-reload-frame"
          class="red-ui-button red-ui-button-small"
          title="Fetch the last frame that went through this node"
        >
          <i class="fa fa-refresh"></i> Reload last frame
        </button>
        <button
          type="button"
          id="line-finder-open-viewer"
          class="red-ui-button red-ui-button-small"
          title="Zoom in and drag the region over the edge"
        >
          <i class="fa fa-search-plus"></i> Viewer
        </button>
        <button type="button" id="line-finder-clear" class="red-ui-button red-ui-button-small">
          Reset
        </button>
        <button
          type="button"
          id="line-finder-run"
          class="red-ui-button red-ui-button-small"
          title="Search the loaded image with the settings below, without deploying"
        >
          <i id="line-finder-run-icon" class="fa fa-play"></i> Run on this image
        </button>
      </div>
      <div
        id="line-finder-frame-caption"
        style="margin-top:4px; color:#999; font-size:12px;"
      ></div>
      <div
        id="line-finder-readout"
        style="margin-top:6px; color:#888; font-size:12px; font-family:monospace;"
      >
        no region
      </div>
      <div
        id="line-finder-run-status"
        style="margin-top:4px; color:#888; font-size:12px; font-family:monospace;"
      ></div>
      <div style="margin-top:4px; color:#999; font-size:12px;">
        The last frame this node saw loads by itself once one has been
        sent; or choose a photo from a file. Open the viewer to zoom in and
        drag <b>across</b> the edge, in the direction the calipers should
        travel.
        The orange arrow is that direction, the dashed green line is the edge
        being looked for, and the pale lines are the calipers themselves.
        Corner handles resize, the amber grip rotates, arrow keys nudge by a
        pixel; click another region to select it. <b>Run on this image</b>
        searches the photo with the settings below and draws what every
        region found - or says why it found nothing.
      </div>
    </div>
  </div>

  <div class="form-row">
    <label for="line-finder-region-name"><i class="fa fa-pencil"></i> Region name</label>
    <input type="text" id="line-finder-region-name" style="width:130px;" placeholder="name" />
    <span class="node-input-hint" style="margin-left:10px; color:#999;"
      >of the selected region; left/right/top/bottom make a rectangle</span
    >
  </div>

  <div class="form-row">
    <label for="node-input-regionX"><i class="fa fa-arrows"></i> Region</label>
    <input type="number" id="node-input-regionX" style="width:70px;" placeholder="x" />
    <input type="number" id="node-input-regionY" style="width:70px;" placeholder="y" />
    <input type="number" id="node-input-regionWidth" style="width:70px;" placeholder="w" />
    <input type="number" id="node-input-regionHeight" style="width:70px;" placeholder="h" />
    <span class="node-input-hint" style="margin-left:8px; color:#999;">x y w h</span>
  </div>

  <div class="form-row">
    <label for="node-input-regionAngleDeg"><i class="fa fa-rotate-right"></i> Region angle</label>
    <input type="number" id="node-input-regionAngleDeg" step="0.1" style="width:80px;" />
    <span class="node-input-hint" style="margin-left:10px; color:#999;"
      >degrees clockwise about the region's centre</span
    >
  </div>

  <div class="form-row">
    <label for="node-input-scanDirection"><i class="fa fa-long-arrow-right"></i> Scan</label>
    <select id="node-input-scanDirection" style="width:130px;">
      <option value="right">left to right</option>
      <option value="left">right to left</option>
      <option value="down">top to bottom</option>
      <option value="up">bottom to top</option>
    </select>
    <span class="node-input-hint" style="margin-left:10px; color:#999;"
      >the edge found is perpendicular to this</span
    >
  </div>

  <div class="form-row">
    <label for="node-input-polarity"><i class="fa fa-adjust"></i> Polarity</label>
    <select id="node-input-polarity" style="width:130px;">
      <option value="either">either</option>
      <option value="darkToLight">dark to light</option>
      <option value="lightToDark">light to dark</option>
    </select>
    <span class="node-input-hint" style="margin-left:10px; color:#999;"
      >as seen travelling along the scan direction</span
    >
  </div>

  <div class="form-row">
    <label for="node-input-edgeSelect"><i class="fa fa-crosshairs"></i> Select</label>
    <select id="node-input-edgeSelect" style="width:130px;">
      <option value="best">strongest edge</option>
      <option value="first">first edge</option>
      <option value="last">last edge</option>
    </select>
    <span class="node-input-hint" style="margin-left:10px; color:#999;"
      >which qualifying edge this region keeps</span
    >
  </div>

  <div class="form-row">
    <label for="node-input-ignoreCount"><i class="fa fa-step-forward"></i> Skip edges</label>
    <input type="number" id="node-input-ignoreCount" min="0" style="width:70px;" />
    <span class="node-input-hint" style="margin-left:10px; color:#999;"
      >qualifying edges to step past before selecting; all regions</span
    >
  </div>

  <div class="form-row">
    <label for="node-input-calipers"><i class="fa fa-bars"></i> Calipers</label>
    <input type="number" id="node-input-calipers" min="1" max="512" style="width:70px;" />
    <span class="node-input-hint" style="margin-left:10px; color:#999;"
      >scans across each region; each averages its own slice</span
    >
  </div>

  <div class="form-row">
    <label for="node-input-contrastThreshold"><i class="fa fa-signal"></i> Contrast</label>
    <input type="number" id="node-input-contrastThreshold" min="0" step="0.1" style="width:70px;" />
    <span class="node-input-hint" style="margin-left:10px; color:#999;"
      >grey levels per pixel of travel; lower finds fainter edges</span
    >
  </div>

  <div class="form-row">
    <label for="node-input-filterHalfWidth"><i class="fa fa-filter"></i> Smoothing</label>
    <input type="number" id="node-input-filterHalfWidth" min="0" max="64" style="width:70px;" />
    <span class="node-input-hint" style="margin-left:10px; color:#999;"
      >box half-width in scan pixels</span
    >
  </div>

  <div class="form-row">
    <label for="node-input-outlierTolerancePx"><i class="fa fa-ban"></i> Outlier</label>
    <input type="number" id="node-input-outlierTolerancePx" min="0.1" step="0.1" style="width:70px;" />
    <span class="node-input-hint" style="margin-left:10px; color:#999;"
      >px from the fitted line before a caliper is dropped</span
    >
  </div>

  <div class="form-row">
    <label for="node-input-minCaliperFraction"><i class="fa fa-check"></i> Min calipers</label>
    <input type="number" id="node-input-minCaliperFraction" min="0.05" max="1" step="0.05" style="width:70px;" />
    <span class="node-input-hint" style="margin-left:10px; color:#999;"
      >fraction that must survive the fit</span
    >
  </div>

  <div class="form-row">
    <label for="node-input-angleToleranceDeg"><i class="fa fa-rotate-left"></i> Angle tol.</label>
    <input type="number" id="node-input-angleToleranceDeg" min="0" max="90" step="0.5" style="width:70px;" />
    <span class="node-input-hint" style="margin-left:10px; color:#999;"
      >degrees from the region's own orientation; blank to skip</span
    >
  </div>

  <div class="form-row">
    <label for="node-input-previewEnabled"
      ><i class="fa fa-eye"></i> Preview</label
    >
    <input
      type="checkbox"
      id="node-input-previewEnabled"
      style="width:auto; vertical-align:top;"
    />
    <label for="node-input-previewEnabled" style="width:auto; margin-left:5px;"
      >Draw the regions, calipers and fitted lines on the flow canvas</label
    >
  </div>

  <div class="form-row" id="line-finder-preview-width-row">
    <label for="node-input-previewWidth"
      ><i class="fa fa-arrows-h"></i> Preview width</label
    >
    <input type="number" id="node-input-previewWidth" min="80" max="600" style="width:80px;" />
    <span class="node-input-hint" style="margin-left:10px; color:#999;"
      >px; diagnostic only - it re-encodes the frame on every message</span
    >
  </div>

  <div class="form-row">
    <label for="node-input-minScore"><i class="fa fa-star-o"></i> Min score</label>
    <input type="number" id="node-input-minScore" min="0" max="1" step="0.05" style="width:70px;" />
    <span class="node-input-hint" style="margin-left:10px; color:#999;"
      >below this a line is reported as not found</span
    >
  </div>
</script>

<script type="text/html" data-help-name="line-finder">
  <p>
    Find a straight edge inside each region you draw. A row of
    <b>calipers</b> scans across the region, each one reports where the
    brightness steps, and a line is fitted through those points with
    outliers dropped. One region finds one edge; several find several,
    and four named <b>left</b>, <b>right</b>, <b>top</b> and <b>bottom</b>
    are intersected into the rectangle they bound.
  </p>
  <p>
    Use it when a whole-frame search finds the <i>wrong</i> edge. That
    happens whenever the strongest contrast near the boundary you want
    belongs to something else - printed artwork a few millimetres inside
    a label edge, a frame vignette outboard of it, a conveyor rail. A
    drawn region settles it by construction: nothing outside the box can
    win.
  </p>

  <h3>Regions</h3>
  <p>
    The list at the top holds every region. Each carries its own box,
    angle, <i>Scan</i>, <i>Polarity</i> and <i>Select</i>; the numeric
    tuning further down (calipers, contrast, smoothing, ...) applies to
    all of them. Click a region to select it - the fields and the viewer
    edit the selected one. <i>Add</i> and <i>Remove</i> do what they say;
    <b>Add rectangle</b> lays out <code>left</code>, <code>right</code>,
    <code>top</code> and <code>bottom</code> around the image centre,
    each scanning inwards, ready to be dragged onto the edges.
    <b>Copy as label-crop edgeRegions</b> puts those four, with the
    tuning, on the clipboard in the JSON <code>label-crop</code>'s
    calipers mode pastes in.
  </p>

  <h3>Drawing a region</h3>
  <p>
    Load a representative photo and the <b>zoom viewer</b> opens on it -
    click the thumbnail or <i>Viewer</i> to reopen it. Drag
    <b>across</b> the edge, in the direction you want the calipers to
    travel. The box should straddle the edge with room for it to move
    frame to frame, and should <b>exclude</b> any stronger edge you do
    not want. Width along the edge buys noise rejection: each caliper
    averages its whole slice, so a step of two or three grey levels is
    perfectly findable over a few hundred rows even though it is
    invisible in any single one.
  </p>
  <p>
    The viewer is where a region actually gets aimed, because at
    thumbnail scale a two-grey-level boundary is not visible at all. It
    opens zoomed onto the selected region and shows what the search will
    do: the <b>orange arrow</b> is the scan direction, the <b>dashed
    green</b> line is the edge being looked for, and the <b>pale
    lines</b> are the calipers themselves - one per band, drawn where
    that band will measure. Turn them off with <i>Calipers</i> if they
    get in the way. The other regions are drawn fainter, each labelled
    with its name; click one to select it.
  </p>
  <ul>
    <li>mouse wheel zooms to the cursor; <i>Fit</i> and <i>100%</i>
      jump; right-drag pans at any time, or switch <i>Mode</i> to Pan</li>
    <li>drag on empty space to redraw the selected region - the drag
      direction sets the scan direction, which is the one thing a static
      box cannot tell you</li>
    <li>corner handles resize from the opposite corner; dragging inside
      moves the box; the arrow keys nudge it a pixel at a time, ten with
      Shift</li>
    <li>the amber grip rotates the region about its centre, to a tenth
      of a degree - hold Shift to snap to five</li>
    <li><i>Scan</i> cycles the direction without redrawing</li>
    <li><i>Apply</i> writes every region back; <i>Cancel</i> or Escape
      leaves them alone</li>
  </ul>
  <p>
    A region may hang off the frame, but the footer says so: a caliper
    band that is not wholly inside the image is skipped rather than
    averaged over a moving pixel count, so a box half off the edge
    quietly loses its calipers.
  </p>

  <h3>Input</h3>
  <p>
    <code>msg.payload</code> — an encoded image Buffer or a raw
    <code>{ data, width, height, channels }</code> object. The payload is
    <b>not</b> modified; this is a measuring tool.
  </p>
  <p>
    <code>msg.regions</code> — optional per-message list of regions in
    the configured shape <code>{ name, x, y, width, height, angleDeg,
    scanDirection, polarity, edgeSelect }</code>, replacing the whole
    list. <code>msg.region</code> — a single
    <code>{ x, y, width, height, angleDeg }</code> that re-aims the node
    to that one region, so one node can be driven rather than copied.
    Every tuning option below can also be overridden by a same-named
    <code>msg</code> property; <code>msg.scanDirection</code>,
    <code>msg.polarity</code> and <code>msg.edgeSelect</code> apply to
    every region.
  </p>

  <h3>Output</h3>
  <p><code>msg.lineFinder</code>, with one region:</p>
  <ul>
    <li><code>found</code> / <code>reason</code> — <code>ok</code>, <code>no-edge</code>,
      <code>too-few-calipers</code>, <code>angle-out-of-tolerance</code>,
      <code>below-min-score</code></li>
    <li><code>line</code> — <code>{ x, y, dx, dy, p0, p1 }</code>: a point on
      the line, a unit direction along it, and the endpoints clipped to the
      region</li>
    <li><code>angleDeg</code> — the line's angle, folded to (-90, 90]</li>
    <li><code>score</code> — coverage × fit tightness, 0..1</li>
    <li><code>calipers</code> — <code>{ total, found, used }</code></li>
    <li><code>residualPx</code> — RMS distance of the used points from the line</li>
    <li><code>points</code> — every caliper hit, each flagged <code>used</code>
      or not, for overlaying on a debug image</li>
    <li><code>lines</code> — the same result again as
      <code>[{ name, ... }]</code>, so a flow written for several regions
      reads one the same way</li>
  </ul>
  <p>With several regions:</p>
  <ul>
    <li><code>lines</code> — one entry per region in list order, each
      <code>{ name, found, reason, line, angleDeg, score, calipers,
      residualPx, points, region }</code></li>
    <li><code>found</code> — true only when every region found its line;
      <code>reason</code> names the first that did not
      (<code>top:no-edge</code>)</li>
    <li><code>rect</code> — when regions named left, right, top and bottom
      exist: <code>{ ok, corners, center, width, height, angleDeg, score,
      residualPx }</code>, corners in the order top-left, top-right,
      bottom-right, bottom-left - the shape <code>label-crop</code>
      reports - or <code>{ ok: false, reason }</code> when a side missed</li>
    <li><code>intersections</code> — <code>[{ a, b, x, y }]</code> for every
      pair of found lines that is not parallel within the angle
      tolerance: the corner of an L-shaped fixture, say</li>
  </ul>
  <p>
    A miss is a normal result, not an error - <code>found</code> is false
    and the flow decides what to do. Only an unusable payload is an error.
  </p>

  <h3>Preview</h3>
  <p>
    Switch <i>Preview</i> on and the node draws its result on the flow
    canvas: every search region as you configured it (a rotated region
    shows as the parallelogram it is), every caliper hit - <b>green</b>
    kept, <b>red</b> dropped by the outlier trim - each <b>yellow</b>
    fitted line and the <b>cyan</b> rectangle when four sides were found,
    with a summary above. Click the preview to dismiss it.
  </p>
  <p>
    A <b>miss</b> previews too, which is the point: it shows whether the
    box is aimed at the wrong edge, clipped by the frame, or straddling
    two steps - none of which a score alone can tell you. It re-encodes
    the frame on every message, so it is a tuning aid, not something to
    leave on in production.
  </p>

  <h3>Tuning</h3>
  <p>
    The dialog opens on the <b>last frame that went through this node</b>
    - kept in memory, one per node, since the last restart - so the region
    is drawn on the picture production actually sees, and a file is only
    needed before the first message or after a restart. <b>Reload last
    frame</b> fetches it again after more frames have gone through.
  </p>
  <p>
    <b>Run on this image</b> runs the real search on the loaded sample
    with the dialog's current settings, without deploying - every region
    at once - and draws each caliper, its edge point (filled when the fit
    kept it, hollow when the outlier trim dropped it), each fitted line
    and the rectangle's corners on the thumbnail. With one region a miss
    is explained in full: which gate stopped it and what to move - for a
    faint edge, the strongest step any caliper actually saw against the
    threshold. With several the status line gives one verdict per
    region: <code>left ✓ 0.1° · right ✓ · top ✗ contrast 1.2&lt;2.0 ·
    bottom ✓</code>. On the last frame the search runs on the very pixels
    the node saw; a sample chosen from a file is decoded by the browser
    first, so the runtime's figures can differ by a fraction of a pixel.
  </p>
  <p>
    Start with <i>Contrast</i> at 2 and lower it until the edge is found;
    if it finds the wrong edge instead, tighten the region rather than
    raising the threshold. <i>Select</i> = <b>first</b> is the
    deterministic choice when two steps of similar strength sit close
    together - <b>strongest</b> can alternate between them from frame to
    frame. <i>Skip edges</i> steps past a known structure, such as a
    frame vignette, without narrowing the box.
  </p>

  <h3>Four of them make a rectangle</h3>
  <p>
    Name four regions left, right, top and bottom and this node reports
    the rectangle itself in <code>msg.lineFinder.rect</code>. To crop to
    it as well, <b>Copy as label-crop edgeRegions</b> and paste into
    <code>label-crop</code>'s <i>calipers</i> boundary mode, which runs
    the same four searches and deskews to the result - far more stable
    than a blob search when the boundary is faint. See that node's help.
  </p>
  <p>
    No OpenCV engine is needed: the search is pure JS and only touches
    the pixels inside the regions, so its cost follows the boxes you
    drew, not the frame size.
  </p>
</script>

<script type="text/javascript">
  // The region list being edited. oneditprepare owns it and oneditsave
  // reads it back; a hidden node-input would make Node-RED store the list
  // as the string an <input> holds, so it stays in this closure instead.
  let lineFinderEditingRegions = null;
  let lineFinderEditingSelected = 0;
  // revokes the object URL of a frame still loading when the dialog closes
  let lineFinderEditingRelease = null;

  RED.nodes.registerType("line-finder", {
    category: "vision",
    color: "#5DADE2",
    defaults: {
      name: { value: "" },
      // one entry per region: { name, x, y, width, height, angleDeg,
      // scanDirection, polarity, edgeSelect }. Empty on a node saved
      // before it existed, whose one region lives in the fields below.
      regions: { value: [] },
      regionX: { value: 0, validate: RED.validators.number(true) },
      regionY: { value: 0, validate: RED.validators.number(true) },
      regionWidth: { value: 100, validate: RED.validators.number(true) },
      regionHeight: { value: 100, validate: RED.validators.number(true) },
      regionAngleDeg: { value: 0, validate: RED.validators.number(true) },
      scanDirection: { value: "right" },
      polarity: { value: "either" },
      edgeSelect: { value: "best" },
      ignoreCount: { value: 0, validate: RED.validators.number(true) },
      calipers: { value: 16, validate: RED.validators.number(true) },
      contrastThreshold: { value: 2, validate: RED.validators.number(true) },
      filterHalfWidth: { value: 2, validate: RED.validators.number(true) },
      outlierTolerancePx: { value: 2.5, validate: RED.validators.number(true) },
      minCaliperFraction: { value: 0.5, validate: RED.validators.number(true) },
      angleToleranceDeg: { value: 10, validate: RED.validators.number(true) },
      minScore: { value: 0, validate: RED.validators.number(true) },
      previewEnabled: { value: false },
      previewWidth: { value: 260, validate: RED.validators.number(true) },
    },
    inputs: 1,
    outputs: 1,
    icon: "font-awesome/fa-minus",
    label: function () {
      if (this.name) return this.name;
      const n = Array.isArray(this.regions) ? this.regions.length : 0;
      return n > 1 ? "line finder ×" + n : "line finder";
    },
    paletteLabel: function () {
      return "line finder";
    },
    oneditprepare: function () {
      // ---- region geometry ------------------------------------------
      // A copy of regionFrame()/regionCorners() from lib/lineFinder.js: the
      // region rotates about its own centre, and the scan direction decides
      // which corner the calipers start from. The editor has to agree with
      // the runtime exactly or the box drawn is not the box searched, so
      // test/editorRegionGeometry.test.js lifts this very function out of
      // the file and runs it against the runtime one.
      // EDITOR_GEOMETRY_START
      const regionFrameEditor = function (region, scanDirection) {
        const a = (region.angleDeg || 0) * (Math.PI / 180);
        const ca = Math.cos(a);
        const sa = Math.sin(a);
        const ex = { x: ca, y: sa };
        const ey = { x: -sa, y: ca };
        const hw = region.width / 2;
        const hh = region.height / 2;
        let scan;
        let line;
        let depth;
        let length;
        let start;
        switch (scanDirection) {
          case "left":
            scan = { x: -ex.x, y: -ex.y };
            line = ey;
            depth = region.width;
            length = region.height;
            start = { u: hw, v: -hh };
            break;
          case "down":
            scan = ey;
            line = ex;
            depth = region.height;
            length = region.width;
            start = { u: -hw, v: -hh };
            break;
          case "up":
            scan = { x: -ey.x, y: -ey.y };
            line = ex;
            depth = region.height;
            length = region.width;
            start = { u: -hw, v: hh };
            break;
          default: // "right"
            scan = ex;
            line = ey;
            depth = region.width;
            length = region.height;
            start = { u: -hw, v: -hh };
            break;
        }
        const cx = region.x + region.width / 2;
        const cy = region.y + region.height / 2;
        const origin = {
          x: cx + start.u * ex.x + start.v * ey.x,
          y: cy + start.u * ex.y + start.v * ey.y,
        };
        const at = function (u, v) {
          return {
            x: origin.x + scan.x * u + line.x * v,
            y: origin.y + scan.y * u + line.y * v,
          };
        };
        return {
          scan: scan,
          line: line,
          origin: origin,
          depth: depth,
          length: length,
          at: at,
          centre: { x: cx, y: cy },
          ex: ex,
          ey: ey,
          corners: [at(0, 0), at(depth, 0), at(depth, length), at(0, length)],
        };
      };
      // EDITOR_GEOMETRY_END

      // ---- region list maths -----------------------------------------
      // What a region entry is, how a rectangle's four are laid out, and
      // the label-crop JSON the Copy button writes. Plain data in, plain
      // data out, no DOM, so test/lineFinderEditor.test.js can lift the
      // block and check it against the runtime's own normalisers.
      // EDITOR_REGIONS_START
      const SCAN_DIRECTIONS = ["right", "left", "down", "up"];
      const POLARITIES = ["either", "darkToLight", "lightToDark"];
      const EDGE_SELECTS = ["best", "first", "last"];
      const RECT_SIDES = ["left", "right", "top", "bottom"];
      const numOr = function (v, fallback) {
        const n = typeof v === "number" ? v : parseFloat(v);
        return Number.isFinite(n) ? n : fallback;
      };
      const oneOf = function (v, allowed, fallback) {
        return allowed.indexOf(v) === -1 ? fallback : v;
      };

      /** A stored or typed region entry into the one shape the editor keeps. */
      const normalizeRegionEditor = function (r, index) {
        const src = r && typeof r === "object" ? r : {};
        return {
          name: String(src.name == null ? "" : src.name).trim() || "region" + ((index || 0) + 1),
          x: numOr(src.x, 0),
          y: numOr(src.y, 0),
          width: Math.max(1, numOr(src.width, 100)),
          height: Math.max(1, numOr(src.height, 100)),
          angleDeg: numOr(src.angleDeg, 0),
          scanDirection: oneOf(src.scanDirection, SCAN_DIRECTIONS, "right"),
          polarity: oneOf(src.polarity, POLARITIES, "either"),
          edgeSelect: oneOf(src.edgeSelect, EDGE_SELECTS, "best"),
        };
      };

      /**
       * The four sides of a rectangle assumed to fill the central 60% of
       * the frame: a box across each edge, 12% of the shorter side deep and
       * running along 70% of that edge - short of the corners so the sides
       * do not overlap the ends - each scanning inwards, as label-crop
       * implies for that side. Sized off the frame so the boxes land on the
       * image whatever its resolution; they are meant to be dragged onto
       * the real edges from there.
       */
      const rectangleRegionsEditor = function (imageW, imageH) {
        const W = imageW > 0 ? imageW : 1000;
        const H = imageH > 0 ? imageH : 750;
        const cx = W / 2;
        const cy = H / 2;
        const rw = W * 0.6;
        const rh = H * 0.6;
        const depth = Math.max(8, Math.round(Math.min(W, H) * 0.12));
        const along = Math.round(rh * 0.7);
        const across = Math.round(rw * 0.7);
        const mk = function (name, x, y, width, height, scanDirection) {
          return {
            name: name,
            x: Math.round(x),
            y: Math.round(y),
            width: width,
            height: height,
            angleDeg: 0,
            scanDirection: scanDirection,
            polarity: "either",
            edgeSelect: "best",
          };
        };
        return [
          mk("left", cx - rw / 2 - depth / 2, cy - along / 2, depth, along, "right"),
          mk("right", cx + rw / 2 - depth / 2, cy - along / 2, depth, along, "left"),
          mk("top", cx - across / 2, cy - rh / 2 - depth / 2, across, depth, "down"),
          mk("bottom", cx - across / 2, cy + rh / 2 - depth / 2, across, depth, "up"),
        ];
      };

      /**
       * Put the four sides into a list: any region already carrying one of
       * their names is replaced, the rest are kept, and the untouched
       * default region a new node starts with is dropped rather than left
       * as a fifth line nobody asked for.
       */
      const mergeRectangleEditor = function (regions, sides) {
        const names = sides.map(function (r) {
          return r.name;
        });
        const only = regions.length === 1 ? regions[0] : null;
        const untouched =
          only &&
          only.name === "line" &&
          only.x === 0 &&
          only.y === 0 &&
          only.width === 100 &&
          only.height === 100;
        const kept = untouched
          ? []
          : regions.filter(function (r) {
              return names.indexOf(r.name) === -1;
            });
        return kept.concat(sides);
      };

      /**
       * The `edgeRegions` object label-crop's calipers mode takes: one
       * entry per side, each the box plus the line-finder options that
       * tuned it. The scan direction is left out on purpose - label-crop
       * implies it from the side, and a value here would override that.
       * Null until all four sides exist.
       */
      const edgeRegionsEditor = function (regions, cfg) {
        const byName = {};
        for (const r of regions) byName[r.name] = r;
        if (
          !RECT_SIDES.every(function (s) {
            return byName[s];
          })
        ) {
          return null;
        }
        const out = {};
        for (const side of RECT_SIDES) {
          const r = byName[side];
          const spec = {
            x: Math.round(r.x),
            y: Math.round(r.y),
            width: Math.max(1, Math.round(r.width)),
            height: Math.max(1, Math.round(r.height)),
          };
          if (r.angleDeg) spec.angleDeg = r.angleDeg;
          if (r.polarity && r.polarity !== "either") spec.polarity = r.polarity;
          if (r.edgeSelect && r.edgeSelect !== "best") spec.edgeSelect = r.edgeSelect;
          for (const k of [
            "calipers",
            "contrastThreshold",
            "filterHalfWidth",
            "ignoreCount",
            "outlierTolerancePx",
            "minCaliperFraction",
          ]) {
            const n = numOr(cfg[k], null);
            if (n !== null) spec[k] = n;
          }
          spec.angleToleranceDeg =
            cfg.angleToleranceDeg === "" || cfg.angleToleranceDeg == null
              ? null
              : numOr(cfg.angleToleranceDeg, 10);
          out[side] = spec;
        }
        return out;
      };
      // EDITOR_REGIONS_END

      // ---- run-on-this-image maths -----------------------------------
      // The crop the Run button sends and the sentences it writes about a
      // miss. Both are plain arithmetic on the result and kept free of the
      // DOM, so test/editorRegionGeometry.test.js can lift them out with
      // the geometry block above and check them.
      // EDITOR_RUN_START
      /**
       * The frame-pixel box to send: the region's bounding box with a
       * margin of at least one caliper band or 32px on every side, snapped
       * outward to whole pixels and clamped to the image. Null when the
       * region lies wholly outside the frame - there is nothing to search.
       */
      const cropBoxEditor = function (region, scanDirection, calipers, imageW, imageH) {
        const f = regionFrameEditor(region, scanDirection);
        const margin = Math.ceil(Math.max(f.length / Math.max(1, calipers), 32));
        let x0 = Infinity;
        let y0 = Infinity;
        let x1 = -Infinity;
        let y1 = -Infinity;
        for (const p of f.corners) {
          x0 = Math.min(x0, p.x);
          y0 = Math.min(y0, p.y);
          x1 = Math.max(x1, p.x);
          y1 = Math.max(y1, p.y);
        }
        x0 = Math.max(0, Math.floor(x0 - margin));
        y0 = Math.max(0, Math.floor(y0 - margin));
        x1 = Math.min(imageW, Math.ceil(x1 + margin));
        y1 = Math.min(imageH, Math.ceil(y1 + margin));
        if (!(x1 > x0) || !(y1 > y0)) return null;
        return { x: x0, y: y0, width: x1 - x0, height: y1 - y0, margin: margin };
      };

      /** A contrast figure at the precision the Contrast field takes. */
      const fmtContrast = function (v) {
        const n = Number(v) || 0;
        return n >= 10 ? n.toFixed(0) : n >= 1 ? n.toFixed(1) : n.toFixed(2);
      };

      /**
       * One sentence on why the search missed and which field to move,
       * from the result's diagnostics and the settings that actually ran.
       * The gates are checked in the order the finder applies them, so the
       * sentence names the first one that stopped it.
       */
      const explainMiss = function (result) {
        const d = result.diagnostics || {};
        const s = result.settings || {};
        const total = (result.calipers && result.calipers.total) || 0;
        const peak = d.peakContrast || 0;
        const threshold = Number(s.contrastThreshold) || 0;
        if (result.reason === "below-min-score") {
          return (
            "score " + Number(result.score).toFixed(2) +
            " is under Min score " + s.minScore +
            " - lower Min score, or tighten the region so more calipers agree"
          );
        }
        if (result.reason === "angle-out-of-tolerance") {
          return (
            "fitted line at " + Number(result.angleDeg).toFixed(1) +
            "° leans more than " + s.angleToleranceDeg + "° from the region" +
            " - rotate the region to match the edge, or raise Angle tol."
          );
        }
        if (!d.calipersInImage) {
          return "no caliper lies wholly inside the image - move the region onto the frame";
        }
        if (peak < threshold) {
          return (
            "strongest edge contrast " + fmtContrast(peak) +
            ", threshold " + fmtContrast(threshold) +
            " - lower Contrast threshold below " + fmtContrast(peak) + " to pick it up" +
            (d.medianPeakContrast < peak
              ? ", below " + fmtContrast(d.medianPeakContrast) + " for most calipers"
              : "")
          );
        }
        if (
          !d.calipersWithEdge && d.peakPolarity &&
          s.polarity !== "either" && s.polarity !== d.peakPolarity
        ) {
          return (
            "strongest edge (contrast " + fmtContrast(peak) + ") runs " + d.peakPolarity +
            " but Polarity is " + s.polarity + " - switch Polarity, or set it to either"
          );
        }
        // enough contrast somewhere, just not in enough calipers
        const need = Math.max(2, Math.ceil(total * (Number(s.minCaliperFraction) || 0)));
        return (
          d.calipersWithEdge + "/" + total + " calipers saw an edge above threshold " +
          fmtContrast(threshold) + ", Min calipers needs " + need +
          (d.calipersInImage < total
            ? " (" + (total - d.calipersInImage) + " lie past the frame)"
            : "") +
          " - lower Contrast towards the median caliper peak " +
          fmtContrast(d.medianPeakContrast) + ", or lower Min calipers"
        );
      };

      /**
       * The same verdict in a few characters, for the one-line-per-region
       * summary when several regions ran: "contrast 1.2<2.0", "calipers
       * 3/16", "angle 23.4°>10°".
       */
      const shortMiss = function (result) {
        const d = result.diagnostics || {};
        const s = result.settings || {};
        if (result.error) return "error: " + result.error;
        if (result.reason === "off-frame" || !d.calipersInImage) return "off the frame";
        if (result.reason === "below-min-score") {
          return "score " + Number(result.score).toFixed(2) + "<" + s.minScore;
        }
        if (result.reason === "angle-out-of-tolerance") {
          return "angle " + Number(result.angleDeg).toFixed(1) + "°>" + s.angleToleranceDeg + "°";
        }
        const peak = d.peakContrast || 0;
        const threshold = Number(s.contrastThreshold) || 0;
        if (peak < threshold) return "contrast " + fmtContrast(peak) + "<" + fmtContrast(threshold);
        if (
          !d.calipersWithEdge && d.peakPolarity &&
          s.polarity !== "either" && s.polarity !== d.peakPolarity
        ) {
          return "polarity is " + d.peakPolarity;
        }
        return "calipers " + (d.calipersWithEdge || 0) + "/" + ((result.calipers && result.calipers.total) || 0);
      };

      /**
       * Where two fitted lines cross, or null when they are near-parallel -
       * the same arithmetic and the same half-degree floor as
       * intersectLines in lib/lineFinder.js, so the corners the editor
       * draws are the corners the node will report.
       */
      const intersectLinesEditor = function (a, b) {
        const denom = a.dx * -b.dy - a.dy * -b.dx;
        if (Math.abs(denom) < 1e-3) return null;
        const rx = b.x - a.x;
        const ry = b.y - a.y;
        const t = (rx * -b.dy - ry * -b.dx) / denom;
        return { x: a.x + a.dx * t, y: a.y + a.dy * t };
      };

      /**
       * The rectangle's corners - top-left, top-right, bottom-right,
       * bottom-left, as rectFromLines orders them - from the per-region
       * results keyed by name, or null unless all four sides were found
       * and none came out parallel.
       */
      const rectCornersEditor = function (byName) {
        const side = function (s) {
          const r = byName[s];
          return r && r.found && r.line ? r.line : null;
        };
        const left = side("left");
        const right = side("right");
        const top = side("top");
        const bottom = side("bottom");
        if (!left || !right || !top || !bottom) return null;
        const corners = [
          intersectLinesEditor(left, top),
          intersectLinesEditor(right, top),
          intersectLinesEditor(right, bottom),
          intersectLinesEditor(left, bottom),
        ];
        return corners.every(Boolean) ? corners : null;
      };
      // EDITOR_RUN_END

      // The caption under the thumbnail says how old the cached frame is.
      // Pure arithmetic, kept out of the DOM so
      // test/editorRegionGeometry.test.js can lift it.
      // EDITOR_FRAME_START
      /** "just now", "40 s ago", "3 min ago", "2 h ago", "3 days ago"; "" when `thenMs` is not a time. */
      const relativeTimeEditor = function (thenMs, nowMs) {
        if (!Number.isFinite(thenMs) || !Number.isFinite(nowMs)) return "";
        const s = Math.max(0, Math.round((nowMs - thenMs) / 1000));
        if (s < 5) return "just now";
        if (s < 60) return s + " s ago";
        const m = Math.round(s / 60);
        if (m < 60) return m + " min ago";
        const h = Math.round(m / 60);
        if (h < 48) return h + " h ago";
        return Math.round(h / 24) + " days ago";
      };
      // EDITOR_FRAME_END

      /**
       * The four corners in the region's own order (top-left, top-right,
       * bottom-right, bottom-left before rotation) rather than in scan
       * order, so a resize handle keeps its identity when the scan
       * direction changes.
       */
      const localCorners = function (region) {
        const f = regionFrameEditor(region, "right");
        const hw = region.width / 2;
        const hh = region.height / 2;
        const at = function (u, v) {
          return {
            x: f.centre.x + u * f.ex.x + v * f.ey.x,
            y: f.centre.y + u * f.ex.y + v * f.ey.y,
          };
        };
        return [at(-hw, -hh), at(hw, -hh), at(hw, hh), at(-hw, hh)];
      };

      /** Pointer position expressed in the region's own axes, from its centre. */
      const toLocal = function (region, px, py) {
        const a = (region.angleDeg || 0) * (Math.PI / 180);
        const ca = Math.cos(a);
        const sa = Math.sin(a);
        const dx = px - (region.x + region.width / 2);
        const dy = py - (region.y + region.height / 2);
        return { u: dx * ca + dy * sa, v: -dx * sa + dy * ca };
      };
      const insideRegion = function (region, px, py) {
        const l = toLocal(region, px, py);
        return Math.abs(l.u) <= region.width / 2 && Math.abs(l.v) <= region.height / 2;
      };

      // ---- fields ----------------------------------------------------
      const node = this;
      const canvas = document.getElementById("line-finder-canvas");
      const ctx = canvas.getContext("2d");
      const readout = document.getElementById("line-finder-readout");
      const fileInput = document.getElementById("line-finder-file");
      const reloadButton = document.getElementById("line-finder-reload-frame");
      const frameCaption = document.getElementById("line-finder-frame-caption");
      const runButton = document.getElementById("line-finder-run");
      const runIcon = document.getElementById("line-finder-run-icon");
      const runStatus = document.getElementById("line-finder-run-status");
      const listEl = document.getElementById("line-finder-region-list");
      const nameField = document.getElementById("line-finder-region-name");
      const addButton = document.getElementById("line-finder-region-add");
      const removeButton = document.getElementById("line-finder-region-remove");
      const addRectButton = document.getElementById("line-finder-add-rect");
      const copyButton = document.getElementById("line-finder-copy-edge-regions");

      const SCAN_ORDER = ["right", "down", "left", "up"];
      const SCAN_ARROW = { right: "→", left: "←", down: "↓", up: "↑" };
      const MIN_SIDE = 4;

      let image = null;
      let imageW = 0;
      let imageH = 0;
      // where the loaded image came from: "cached" is the node's own last
      // frame, so Run can name the node and skip the upload; "file" is a
      // sample the operator chose, which only the browser has
      let imageSource = null;
      // the object URL of a frame still being decoded, revoked once it has
      // loaded or when the dialog closes, whichever comes first
      let imageUrl = null;
      // what the last Run on this image came back with, per region name,
      // in image pixels - and the rectangle's corners when four sides made one
      let runResults = null;
      let runRect = null;
      let running = false;

      const field = function (id) {
        return document.getElementById("node-input-" + id);
      };
      const num = function (id) {
        const v = parseFloat(field(id).value);
        return Number.isFinite(v) ? v : 0;
      };
      const clamp = function (v, lo, hi) {
        return Math.min(hi, Math.max(lo, v));
      };

      // ---- the region list -------------------------------------------
      // `regions` is the store; the fields show the selected entry and
      // write back into it on change. A node saved before the list existed
      // has its one region in the fields, so that is where the list starts.
      let regions;
      let selected = 0;
      {
        const stored = Array.isArray(node.regions) ? node.regions : [];
        regions = stored
          .filter(function (r) {
            return r && typeof r === "object";
          })
          .map(normalizeRegionEditor);
        if (!regions.length) {
          regions = [
            normalizeRegionEditor({
              name: "line",
              x: field("regionX").value,
              y: field("regionY").value,
              width: field("regionWidth").value,
              height: field("regionHeight").value,
              angleDeg: field("regionAngleDeg").value,
              scanDirection: field("scanDirection").value,
              polarity: field("polarity").value,
              edgeSelect: field("edgeSelect").value,
            }),
          ];
        }
      }
      lineFinderEditingRegions = regions;
      lineFinderEditingSelected = 0;

      const currentRegion = function () {
        return {
          x: num("regionX"),
          y: num("regionY"),
          width: Math.max(MIN_SIDE, num("regionWidth")),
          height: Math.max(MIN_SIDE, num("regionHeight")),
          angleDeg: num("regionAngleDeg"),
        };
      };
      const currentScan = function () {
        return field("scanDirection").value || "right";
      };
      const currentCalipers = function () {
        const n = parseInt(field("calipers").value, 10);
        return Number.isFinite(n) ? clamp(n, 1, 512) : 16;
      };
      // the node-wide settings oneditsave stores, by the names the runtime
      // reads them under; sent as typed, the runtime clamps them the way a
      // deploy would. The three per-region modes are added per region.
      const RUN_SETTINGS = [
        "ignoreCount",
        "calipers",
        "contrastThreshold",
        "filterHalfWidth",
        "outlierTolerancePx",
        "minCaliperFraction",
        "angleToleranceDeg",
        "minScore",
      ];
      const currentCfg = function (region) {
        const cfg = {};
        for (const id of RUN_SETTINGS) cfg[id] = field(id).value;
        if (region) {
          cfg.scanDirection = region.scanDirection;
          cfg.polarity = region.polarity;
          cfg.edgeSelect = region.edgeSelect;
        }
        return cfg;
      };
      const geometryOf = function (region) {
        return {
          x: region.x,
          y: region.y,
          width: region.width,
          height: region.height,
          angleDeg: region.angleDeg,
        };
      };
      const writeRegion = function (region, scanDirection) {
        field("regionX").value = Math.round(region.x);
        field("regionY").value = Math.round(region.y);
        field("regionWidth").value = Math.max(1, Math.round(region.width));
        field("regionHeight").value = Math.max(1, Math.round(region.height));
        field("regionAngleDeg").value =
          Math.round((region.angleDeg || 0) * 10) / 10;
        field("scanDirection").value = scanDirection;
      };
      /** Show a list entry in the fields. */
      const writeFields = function (region) {
        writeRegion(region, region.scanDirection);
        field("polarity").value = region.polarity;
        field("edgeSelect").value = region.edgeSelect;
        nameField.value = region.name;
      };
      /** The fields as a list entry, keeping the name unique in the list. */
      const readFields = function () {
        const r = normalizeRegionEditor({
          name: nameField.value,
          x: field("regionX").value,
          y: field("regionY").value,
          width: field("regionWidth").value,
          height: field("regionHeight").value,
          angleDeg: field("regionAngleDeg").value,
          scanDirection: currentScan(),
          polarity: field("polarity").value,
          edgeSelect: field("edgeSelect").value,
        }, selected);
        return r;
      };
      const uniqueName = function (base, skipIndex) {
        const taken = {};
        regions.forEach(function (r, i) {
          if (i !== skipIndex) taken[r.name] = true;
        });
        if (!taken[base]) return base;
        let n = 2;
        while (taken[base + n]) n++;
        return base + n;
      };

      const hasRegion = function (r) {
        return r.width > 0 && r.height > 0;
      };
      const outsideFrame = function (region, scanDirection) {
        if (!imageW || !imageH) return false;
        return regionFrameEditor(region, scanDirection).corners.some(function (p) {
          return p.x < 0 || p.y < 0 || p.x > imageW || p.y > imageH;
        });
      };

      const describeRegion = function (region, scanDirection) {
        const bands = currentCalipers();
        const f = regionFrameEditor(region, scanDirection);
        return (
          "x " + Math.round(region.x) +
          "  y " + Math.round(region.y) +
          "  " + Math.round(region.width) + "×" + Math.round(region.height) + " px" +
          "  " + (Math.round((region.angleDeg || 0) * 10) / 10) + "°" +
          "  scan " + SCAN_ARROW[scanDirection] +
          "  " + bands + " calipers of " + (f.length / bands).toFixed(1) + " px"
        );
      };

      const updateReadout = function () {
        const r = currentRegion();
        if (!hasRegion(r)) {
          readout.textContent = "no region";
          return;
        }
        readout.textContent =
          (regions.length > 1 ? regions[selected].name + ":  " : "") +
          describeRegion(r, currentScan()) +
          (imageW ? "   (image " + imageW + "×" + imageH + ")" : "") +
          (outsideFrame(r, currentScan()) ? "   ⚠ past the frame" : "");
      };

      const hasRectSides = function (list) {
        const names = list.map(function (r) {
          return r.name;
        });
        return RECT_SIDES.every(function (s) {
          return names.indexOf(s) !== -1;
        });
      };

      /** Redraw the list: one row per region, the selected one highlighted. */
      const renderList = function () {
        const rows = regions.map(function (r, i) {
          const row = document.createElement("div");
          row.style.cssText =
            "padding:2px 6px; cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;" +
            (i === selected
              ? "background:#2196f3; color:#fff;"
              : i % 2 ? "background:#f2f2f2;" : "");
          row.textContent =
            r.name + "  " + SCAN_ARROW[r.scanDirection] +
            "  x " + Math.round(r.x) + " y " + Math.round(r.y) +
            "  " + Math.round(r.width) + "×" + Math.round(r.height) +
            (r.angleDeg ? "  " + (Math.round(r.angleDeg * 10) / 10) + "°" : "") +
            (r.polarity !== "either" ? "  " + r.polarity : "") +
            (r.edgeSelect !== "best" ? "  " + r.edgeSelect : "");
          row.title = "select " + r.name;
          row.addEventListener("click", function () {
            selectRegion(i);
          });
          return row;
        });
        listEl.replaceChildren.apply(listEl, rows);
        removeButton.disabled = regions.length <= 1;
        copyButton.disabled = !hasRectSides(regions);
      };

      /** Make region i the one the fields and the viewer edit. */
      const selectRegion = function (i) {
        if (i < 0 || i >= regions.length) return;
        selected = i;
        lineFinderEditingSelected = i;
        writeFields(regions[i]);
        renderList();
        updateReadout();
        drawThumb();
      };

      /** The fields changed: write them into the selected entry. */
      const commitFields = function () {
        const r = readFields();
        r.name = uniqueName(r.name, selected);
        regions[selected] = r;
        if (nameField.value !== r.name) nameField.value = r.name;
        renderList();
      };

      // ---- shared overlay drawing ------------------------------------
      // Both the thumbnail and the viewer draw the regions through this, in
      // screen coordinates, so line weights stay one pixel at any zoom.
      const drawArrow = function (c, x0, y0, x1, y1) {
        c.beginPath();
        c.moveTo(x0, y0);
        c.lineTo(x1, y1);
        c.stroke();
        const a = Math.atan2(y1 - y0, x1 - x0);
        c.beginPath();
        c.moveTo(x1, y1);
        c.lineTo(x1 - 9 * Math.cos(a - 0.4), y1 - 9 * Math.sin(a - 0.4));
        c.lineTo(x1 - 9 * Math.cos(a + 0.4), y1 - 9 * Math.sin(a + 0.4));
        c.closePath();
        c.fill();
      };

      /**
       * One region. `opts.passive` draws it fainter - a region that is
       * not the one being edited - and `opts.label` writes its name just
       * outside the edge the scan starts from.
       */
      const drawRegion = function (c, region, scanDirection, toScreen, opts) {
        if (!hasRegion(region)) return;
        const o = opts || {};
        const f = regionFrameEditor(region, scanDirection);
        const S = function (u, v) {
          const p = f.at(u, v);
          return toScreen(p.x, p.y);
        };

        const box = f.corners.map(function (p) {
          return toScreen(p.x, p.y);
        });
        c.beginPath();
        c.moveTo(box[0].x, box[0].y);
        for (let i = 1; i < box.length; i++) c.lineTo(box[i].x, box[i].y);
        c.closePath();
        c.fillStyle = o.passive ? "rgba(33,150,243,0.06)" : "rgba(33,150,243,0.12)";
        c.fill();
        // a dark under-stroke so the box reads on pale and dark frames alike
        c.lineJoin = "round";
        c.strokeStyle = o.passive ? "rgba(0,0,0,0.4)" : "rgba(0,0,0,0.6)";
        c.lineWidth = o.passive ? 2 : 3;
        c.stroke();
        c.strokeStyle = o.passive ? "rgba(33,150,243,0.75)" : "#2196f3";
        c.lineWidth = o.passive ? 1 : 1.5;
        c.stroke();

        // one line per caliper, along the scan axis at the band's centre:
        // this is literally where each measurement is taken
        if (o.showCalipers) {
          const bands = currentCalipers();
          const bandLength = f.length / bands;
          const a0 = S(0, 0);
          const a1 = S(0, bandLength);
          const spacing = Math.hypot(a1.x - a0.x, a1.y - a0.y);
          if (spacing >= 3) {
            c.strokeStyle = "rgba(255,255,255,0.45)";
            c.lineWidth = 1;
            for (let b = 0; b < bands; b++) {
              const v = bandLength * (b + 0.5);
              const a = S(0, v);
              const z = S(f.depth, v);
              c.beginPath();
              c.moveTo(a.x, a.y);
              c.lineTo(z.x, z.y);
              c.stroke();
            }
          }
        }

        // the edge being looked for runs across the scan, through the middle
        const e0 = S(f.depth / 2, 0);
        const e1 = S(f.depth / 2, f.length);
        c.strokeStyle = o.passive ? "rgba(76,175,80,0.5)" : "rgba(76,175,80,0.9)";
        c.lineWidth = 1;
        c.setLineDash([5, 4]);
        c.beginPath();
        c.moveTo(e0.x, e0.y);
        c.lineTo(e1.x, e1.y);
        c.stroke();
        c.setLineDash([]);

        // and the scan direction, from the starting edge inward
        const a0 = S(0, f.length / 2);
        const a1 = S(f.depth, f.length / 2);
        c.strokeStyle = o.passive ? "rgba(230,81,0,0.6)" : "#e65100";
        c.fillStyle = c.strokeStyle;
        c.lineWidth = o.passive ? 1 : 2;
        drawArrow(c, a0.x, a0.y, a1.x, a1.y);

        // the name, a little outside the edge the scan starts from
        if (o.label) {
          const len = Math.hypot(a1.x - a0.x, a1.y - a0.y) || 1;
          const px = a0.x - ((a1.x - a0.x) / len) * 9;
          const py = a0.y - ((a1.y - a0.y) / len) * 9;
          c.font = (o.passive ? "11px" : "bold 11px") + " sans-serif";
          c.textAlign = "center";
          c.textBaseline = "middle";
          c.lineWidth = 3;
          c.strokeStyle = "rgba(0,0,0,0.7)";
          c.strokeText(o.label, px, py);
          c.fillStyle = o.passive ? "#e3f2fd" : "#ffffff";
          c.fillText(o.label, px, py);
        }
      };

      /** Every region in a list, the selected one on top and in full. */
      const drawRegions = function (c, list, selIndex, toScreen, opts) {
        const o = opts || {};
        const many = list.length > 1;
        list.forEach(function (r, i) {
          if (i === selIndex) return;
          drawRegion(c, geometryOf(r), r.scanDirection, toScreen, {
            passive: true,
            label: many ? r.name : null,
          });
        });
        const sel = list[selIndex];
        if (sel) {
          drawRegion(c, o.geometry || geometryOf(sel), o.scan || sel.scanDirection, toScreen, {
            showCalipers: o.showCalipers,
            label: many ? sel.name : null,
          });
        }
      };

      // ---- run result overlay ----------------------------------------
      // What the last Run found, drawn through the same mapping as the
      // regions so it lands on the pixels it measured: every caliper as a
      // thin line (red when its band fell past the frame), its edge point
      // filled when the fit kept it and hollow when the outlier trim
      // dropped it, the fitted line in yellow across the region, and the
      // rectangle in cyan when four sides made one.
      const drawOneResult = function (c, r, toScreen) {
        const S = function (p) {
          return toScreen(p.x, p.y);
        };
        for (const cal of r.caliperLines || []) {
          const a = S(cal.p0);
          const z = S(cal.p1);
          c.strokeStyle = cal.complete ? "rgba(255,255,255,0.7)" : "rgba(239,83,80,0.6)";
          c.lineWidth = 1;
          c.beginPath();
          c.moveTo(a.x, a.y);
          c.lineTo(z.x, z.y);
          c.stroke();
          if (!cal.edge) continue;
          const e = S(cal.edge);
          c.beginPath();
          c.arc(e.x, e.y, 3, 0, Math.PI * 2);
          if (cal.used) {
            c.fillStyle = "#66bb6a";
            c.fill();
          } else {
            c.strokeStyle = "#ef5350";
            c.lineWidth = 1.5;
            c.stroke();
          }
        }
        if (r.line) {
          const a = S(r.line.p0);
          const z = S(r.line.p1);
          c.beginPath();
          c.moveTo(a.x, a.y);
          c.lineTo(z.x, z.y);
          c.strokeStyle = "rgba(0,0,0,0.6)";
          c.lineWidth = 3.5;
          c.stroke();
          c.strokeStyle = "#ffeb3b";
          c.lineWidth = 1.5;
          c.stroke();
        }
      };
      const drawRunResult = function (c, toScreen) {
        if (!runResults) return;
        for (const name of Object.keys(runResults)) {
          drawOneResult(c, runResults[name], toScreen);
        }
        if (runRect) {
          const pts = runRect.map(function (p) {
            return toScreen(p.x, p.y);
          });
          c.beginPath();
          c.moveTo(pts[0].x, pts[0].y);
          for (let i = 1; i < pts.length; i++) c.lineTo(pts[i].x, pts[i].y);
          c.closePath();
          c.strokeStyle = "rgba(0,0,0,0.6)";
          c.lineWidth = 3;
          c.stroke();
          c.strokeStyle = "#00e5ff";
          c.lineWidth = 1.5;
          c.stroke();
          for (const p of pts) {
            c.beginPath();
            c.arc(p.x, p.y, 4, 0, Math.PI * 2);
            c.fillStyle = "#00e5ff";
            c.fill();
          }
        }
      };

      // ---- thumbnail -------------------------------------------------
      const fit = function () {
        if (!imageW || !imageH) return { s: 1, dx: 0, dy: 0 };
        const s = Math.min(canvas.width / imageW, canvas.height / imageH);
        return {
          s: s,
          dx: (canvas.width - imageW * s) / 2,
          dy: (canvas.height - imageH * s) / 2,
        };
      };

      const drawThumb = function () {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        if (!image) {
          ctx.fillStyle = "#999";
          ctx.font = "12px sans-serif";
          ctx.textAlign = "center";
          ctx.fillText("Load a sample image below,", canvas.width / 2, 106);
          ctx.fillText("then click here for the zoom viewer", canvas.width / 2, 124);
          return;
        }
        const f = fit();
        const toScreen = function (x, y) {
          return { x: f.dx + x * f.s, y: f.dy + y * f.s };
        };
        ctx.drawImage(image, f.dx, f.dy, imageW * f.s, imageH * f.s);
        drawRegions(ctx, regions, selected, toScreen, {
          geometry: currentRegion(),
          scan: currentScan(),
          showCalipers: false,
        });
        drawRunResult(ctx, toScreen);
      };

      // ---- run on this image -----------------------------------------
      const setRunStatus = function (text, tone) {
        runStatus.textContent = text;
        runStatus.style.color =
          tone === "ok" ? "#2e7d32" : tone === "miss" ? "#b26a00" : tone === "error" ? "#c62828" : "#888";
      };
      const clearRun = function () {
        runResults = null;
        runRect = null;
        setRunStatus("", "");
      };
      const describeRun = function (r) {
        return (
          r.angleDeg.toFixed(2) + "°  ·  " +
          r.calipers.used + "/" + r.calipers.total + " calipers  ·  " +
          "score " + r.score.toFixed(2) + "  ·  " +
          "resid " + r.residualPx.toFixed(2) + " px"
        );
      };
      const decodeNote = function () {
        return imageSource === "cached"
          ? "   (on the last frame through this node)"
          : "   (browser-decoded sample: runtime figures can differ by a fraction of a pixel)";
      };

      /**
       * Every region's results are in: one line of status. A single region
       * gets the full explanation; several get a verdict each, and the
       * rectangle's size when left/right/top/bottom all found their edge.
       */
      const finishRun = function (list) {
        if (list.length === 1) {
          const r = runResults[list[0].name];
          if (r.error) {
            setRunStatus("run failed: " + r.error, "error");
          } else if (r.reason === "off-frame") {
            setRunStatus("the region lies wholly outside the image - nothing to search", "miss");
          } else if (r.found) {
            setRunStatus("found  " + describeRun(r) + decodeNote(), "ok");
          } else {
            setRunStatus(
              "not found (" + r.reason + "): " + explainMiss(r) + decodeNote(),
              "miss",
            );
          }
        } else {
          const parts = list.map(function (region) {
            const r = runResults[region.name];
            return r.found
              ? region.name + " ✓ " + Number(r.angleDeg).toFixed(1) + "°"
              : region.name + " ✗ " + shortMiss(r);
          });
          runRect = rectCornersEditor(runResults);
          let text = parts.join("  ·  ");
          if (runRect) {
            const d = function (p, q) {
              return Math.hypot(p.x - q.x, p.y - q.y);
            };
            const w = (d(runRect[0], runRect[1]) + d(runRect[3], runRect[2])) / 2;
            const h = (d(runRect[0], runRect[3]) + d(runRect[1], runRect[2])) / 2;
            text += "  ·  rect " + Math.round(w) + "×" + Math.round(h) + " px";
          }
          const allFound = list.every(function (region) {
            return runResults[region.name].found;
          });
          const anyError = list.some(function (region) {
            return runResults[region.name].error;
          });
          setRunStatus(text + decodeNote(), anyError ? "error" : allFound ? "ok" : "miss");
        }
        running = false;
        runButton.disabled = !image;
        runIcon.className = "fa fa-play";
        drawThumb();
      };

      /**
       * The real search, on the loaded image, with the settings as they
       * stand in the dialog - without a deploy - once per region. When the
       * image is the node's own last frame nothing but the node id crosses
       * the wire and the runtime searches the frame it has. For a file
       * only a crop around each region does: httpAdmin caps a JSON body at
       * 5MB by default, which a full frame as PNG would not fit, so the
       * runtime is told where the crop sits and answers in frame
       * coordinates.
       */
      const runOnImage = function () {
        if (!image || running) return;
        commitFields();
        const list = regions.slice();
        runResults = {};
        runRect = null;
        running = true;
        runButton.disabled = true;
        runIcon.className = "fa fa-spinner fa-spin";
        setRunStatus("running…", "");
        let pending = list.length;
        const settle = function () {
          pending--;
          if (pending === 0) finishRun(list);
        };
        for (const region of list) {
          const geometry = geometryOf(region);
          const box = cropBoxEditor(geometry, region.scanDirection, currentCalipers(), imageW, imageH);
          if (!box) {
            runResults[region.name] = { found: false, reason: "off-frame", calipers: null };
            settle();
            continue;
          }
          let request;
          if (imageSource === "cached") {
            request = { nodeId: node.id, region: geometry, cfg: currentCfg(region) };
          } else {
            const crop = document.createElement("canvas");
            crop.width = box.width;
            crop.height = box.height;
            crop
              .getContext("2d")
              .drawImage(image, box.x, box.y, box.width, box.height, 0, 0, box.width, box.height);
            const dataUrl = crop.toDataURL("image/png");
            request = {
              image: dataUrl.slice(dataUrl.indexOf(",") + 1),
              offset: { x: box.x, y: box.y },
              region: geometry,
              cfg: currentCfg(region),
            };
          }
          $.ajax({
            url: "line-finder/run",
            type: "POST",
            contentType: "application/json",
            dataType: "json",
            data: JSON.stringify(request),
          })
            .done(function (data) {
              const r = data && data.result;
              runResults[region.name] = r || { found: false, reason: "error", error: "no result came back" };
            })
            .fail(function (xhr) {
              const body = xhr && xhr.responseJSON;
              runResults[region.name] = {
                found: false,
                reason: "error",
                error: (body && body.error) || (xhr && xhr.statusText) || "no response",
              };
            })
            .always(settle);
        }
      };

      // ---- copy as label-crop edgeRegions ----------------------------
      const copyText = function (text) {
        const nav = window.navigator;
        if (nav && nav.clipboard && typeof nav.clipboard.writeText === "function") {
          return nav.clipboard.writeText(text);
        }
        // the older path: select the text in an off-screen textarea and
        // ask the document to copy it
        const ta = document.createElement("textarea");
        ta.value = text;
        ta.style.cssText = "position:fixed; left:-9999px; top:0;";
        document.body.appendChild(ta);
        ta.focus();
        if (typeof ta.select === "function") ta.select();
        let ok = false;
        try {
          ok = typeof document.execCommand === "function" && document.execCommand("copy");
        } catch (e) {
          ok = false;
        }
        ta.remove();
        return ok ? Promise.resolve() : Promise.reject(new Error("copy is not available here"));
      };
      const copyEdgeRegions = function () {
        commitFields();
        const spec = edgeRegionsEditor(regions, currentCfg());
        if (!spec) {
          setRunStatus("name four regions left, right, top and bottom first", "miss");
          return;
        }
        const json = JSON.stringify(spec, null, 2);
        copyText(json).then(
          function () {
            setRunStatus(
              "copied edgeRegions for left/right/top/bottom - paste into label-crop's Edge regions",
              "ok",
            );
          },
          function (err) {
            setRunStatus("could not copy: " + ((err && err.message) || err), "error");
            RED.notify("line-finder: the clipboard is not available - the JSON is in the browser console", "warning");
            if (window.console) window.console.log(json);
          },
        );
      };

      // ---- zoomable modal viewer -------------------------------------
      let viewer = null;

      const openViewer = function () {
        if (!image) {
          readout.textContent = "Load a sample image first.";
          return;
        }
        if (viewer) return;
        commitFields();

        const dpr = window.devicePixelRatio || 1;
        // the list being edited, committed to `regions` only on Apply; `reg`
        // and `scan` are the selected entry's geometry and direction, kept
        // separate because every gesture below rewrites them wholesale
        const vregs = regions.map(function (r) {
          return Object.assign({}, r);
        });
        let vsel = selected;
        let reg = geometryOf(vregs[vsel]);
        let scan = vregs[vsel].scanDirection;
        let showCalipers = true;
        let mode = "draw";
        const syncSel = function () {
          vregs[vsel] = Object.assign({}, vregs[vsel], reg, { scanDirection: scan });
        };

        const overlay = document.createElement("div");
        overlay.style.cssText =
          "position:fixed;inset:0;z-index:100000;background:rgba(0,0,0,0.78);" +
          "display:flex;flex-direction:column;align-items:center;justify-content:center;" +
          "font:12px/1.4 sans-serif;color:#ddd;";

        const mkButton = function (text, title) {
          const b = document.createElement("button");
          b.type = "button";
          b.textContent = text;
          b.title = title || "";
          b.style.cssText =
            "background:#4a4d54;color:#eee;border:1px solid #666;border-radius:3px;" +
            "padding:3px 9px;cursor:pointer;font:12px sans-serif;";
          return b;
        };

        const header = document.createElement("div");
        header.style.cssText =
          "display:flex;align-items:center;gap:6px;width:92vw;max-width:1200px;" +
          "padding:6px 8px;background:#33353a;border:1px solid #555;border-bottom:none;" +
          "border-radius:6px 6px 0 0;box-sizing:border-box;flex:0 0 auto;";

        const btnZoomOut = mkButton("−", "Zoom out (mouse wheel zooms to cursor)");
        const btnZoomIn = mkButton("+", "Zoom in");
        const btnFit = mkButton("Fit", "Fit the image into the window");
        const btn100 = mkButton("100%", "Actual pixel size");
        const btnMode = mkButton(
          "Mode: Draw",
          "Drag to draw the region; right-drag pans",
        );
        const btnScan = mkButton(
          "Scan " + SCAN_ARROW[scan],
          "Cycle the scan direction (drawing a new region sets it too)",
        );
        const btnCalipers = mkButton("Calipers", "Show or hide the caliper lines");
        const imgInfo = document.createElement("span");
        imgInfo.style.color = "#999";
        const btnClose = mkButton("✕", "Close without applying");
        btnClose.style.marginLeft = "auto";
        header.append(
          btnZoomOut, btnZoomIn, btnFit, btn100,
          btnMode, btnScan, btnCalipers, imgInfo, btnClose,
        );

        const body = document.createElement("div");
        body.style.cssText =
          "width:92vw;max-width:1200px;height:76vh;background:#232325;" +
          "border:1px solid #555;position:relative;overflow:hidden;box-sizing:border-box;";

        const viewCanvas = document.createElement("canvas");
        viewCanvas.style.cssText =
          "position:absolute;inset:0;width:100%;height:100%;display:block;" +
          "touch-action:none;cursor:crosshair;";
        body.appendChild(viewCanvas);
        const vctx = viewCanvas.getContext("2d");

        const footer = document.createElement("div");
        footer.style.cssText =
          "width:92vw;max-width:1200px;padding:6px 8px;background:#33353a;border:1px solid #555;" +
          "border-top:none;border-radius:0 0 6px 6px;box-sizing:border-box;flex:0 0 auto;" +
          "display:flex;align-items:center;gap:10px;";
        const footReadout = document.createElement("span");
        footReadout.style.color = "#bbb";
        footReadout.style.fontFamily = "monospace";
        const btnApply = mkButton("Apply", "Write the regions into the node");
        btnApply.style.background = "#3574f0";
        btnApply.style.borderColor = "#3574f0";
        btnApply.style.marginLeft = "auto";
        const btnCancel = mkButton("Cancel", "Close without applying");
        footer.append(footReadout, btnApply, btnCancel);

        overlay.append(header, body, footer);
        document.body.appendChild(overlay);
        viewer = overlay;

        // view.scale/ox/oy map image space -> canvas CSS px
        const view = { scale: 1, ox: 0, oy: 0 };
        const toImage = function (ev) {
          const b = viewCanvas.getBoundingClientRect();
          return {
            x: (ev.clientX - b.left - view.ox) / view.scale,
            y: (ev.clientY - b.top - view.oy) / view.scale,
          };
        };
        const toScreen = function (x, y) {
          return { x: view.ox + x * view.scale, y: view.oy + y * view.scale };
        };
        const fitView = function () {
          const w = body.clientWidth;
          const h = body.clientHeight;
          view.scale = Math.min(w / imageW, h / imageH, 1) * 0.96;
          view.ox = (w - imageW * view.scale) / 2;
          view.oy = (h - imageH * view.scale) / 2;
        };
        const zoomAt = function (cx, cy, factor) {
          const ix = (cx - view.ox) / view.scale;
          const iy = (cy - view.oy) / view.scale;
          view.scale = clamp(view.scale * factor, 0.02, 40);
          view.ox = cx - ix * view.scale;
          view.oy = cy - iy * view.scale;
        };

        // ---- hit testing ---------------------------------------------
        const HANDLE = 5; // half-size in screen px
        const TOL = 11;
        const handlePoints = function () {
          return localCorners(reg).map(function (p) {
            return toScreen(p.x, p.y);
          });
        };
        /** The rotation grip: 30 screen px beyond the +u edge, on the centre line. */
        const rotatePoint = function () {
          const f = regionFrameEditor(reg, "right");
          const edge = {
            x: f.centre.x + (reg.width / 2) * f.ex.x,
            y: f.centre.y + (reg.width / 2) * f.ex.y,
          };
          const s = toScreen(edge.x, edge.y);
          return { x: s.x + f.ex.x * 30, y: s.y + f.ex.y * 30 };
        };
        const hitHandle = function (sx, sy) {
          const pts = handlePoints();
          for (let i = 0; i < pts.length; i++) {
            if (Math.abs(pts[i].x - sx) <= TOL && Math.abs(pts[i].y - sy) <= TOL) {
              return i;
            }
          }
          return -1;
        };
        const hitRotate = function (sx, sy) {
          const r = rotatePoint();
          return Math.hypot(r.x - sx, r.y - sy) <= TOL;
        };
        const inside = function (px, py) {
          return insideRegion(reg, px, py);
        };
        /** Another region under the pointer, or -1. */
        const hitOtherRegion = function (px, py) {
          for (let i = 0; i < vregs.length; i++) {
            if (i !== vsel && insideRegion(vregs[i], px, py)) return i;
          }
          return -1;
        };
        const selectInViewer = function (i) {
          syncSel();
          vsel = i;
          reg = geometryOf(vregs[vsel]);
          scan = vregs[vsel].scanDirection;
          btnScan.textContent = "Scan " + SCAN_ARROW[scan];
        };

        // ---- edits ---------------------------------------------------
        const fromCorners = function (a, b, angleDeg) {
          // a and b are opposite corners in the region's own axes, measured
          // from the *old* centre; rebuild x/y/w/h from them
          const w = Math.max(MIN_SIDE, Math.abs(b.u - a.u));
          const h = Math.max(MIN_SIDE, Math.abs(b.v - a.v));
          const mid = { u: (a.u + b.u) / 2, v: (a.v + b.v) / 2 };
          const rad = (angleDeg || 0) * (Math.PI / 180);
          const ca = Math.cos(rad);
          const sa = Math.sin(rad);
          const cx = reg.x + reg.width / 2 + mid.u * ca - mid.v * sa;
          const cy = reg.y + reg.height / 2 + mid.u * sa + mid.v * ca;
          return { x: cx - w / 2, y: cy - h / 2, width: w, height: h, angleDeg: angleDeg };
        };
        const resizeByHandle = function (handleIndex, px, py) {
          const signs = [
            { u: -1, v: -1 },
            { u: 1, v: -1 },
            { u: 1, v: 1 },
            { u: -1, v: 1 },
          ][handleIndex];
          const fixed = {
            u: -signs.u * (reg.width / 2),
            v: -signs.v * (reg.height / 2),
          };
          const moved = toLocal(reg, px, py);
          return fromCorners(fixed, moved, reg.angleDeg);
        };
        const newRegionFromDrag = function (from, to) {
          const x0 = clamp(Math.min(from.x, to.x), 0, imageW);
          const y0 = clamp(Math.min(from.y, to.y), 0, imageH);
          const x1 = clamp(Math.max(from.x, to.x), 0, imageW);
          const y1 = clamp(Math.max(from.y, to.y), 0, imageH);
          const dx = to.x - from.x;
          const dy = to.y - from.y;
          // the drag's dominant axis and sign is the scan direction: which
          // way the calipers travel is the one thing a static box cannot say
          scan =
            Math.abs(dx) >= Math.abs(dy)
              ? dx >= 0 ? "right" : "left"
              : dy >= 0 ? "down" : "up";
          return {
            x: x0,
            y: y0,
            width: Math.max(MIN_SIDE, x1 - x0),
            height: Math.max(MIN_SIDE, y1 - y0),
            angleDeg: 0,
          };
        };

        // ---- painting ------------------------------------------------
        let boardPattern = null;
        const drawView = function () {
          const w = body.clientWidth;
          const h = body.clientHeight;
          vctx.clearRect(0, 0, w, h);
          if (!boardPattern) {
            const p = document.createElement("canvas");
            p.width = 28;
            p.height = 28;
            const pc = p.getContext("2d");
            pc.fillStyle = "#26262a";
            pc.fillRect(0, 0, 28, 28);
            pc.fillStyle = "#2d2d32";
            pc.fillRect(0, 0, 14, 14);
            pc.fillRect(14, 14, 14, 14);
            boardPattern = vctx.createPattern(p, "repeat");
          }
          vctx.fillStyle = boardPattern;
          vctx.fillRect(0, 0, w, h);

          vctx.save();
          vctx.translate(view.ox, view.oy);
