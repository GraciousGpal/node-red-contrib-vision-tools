<script type="text/html" data-template-name="barcode-locate">
  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-input-name" placeholder="Name" />
  </div>
  <div class="form-row">
    <label for="node-input-mode"><i class="fa fa-search"></i> Mode</label>
    <select id="node-input-mode" style="width:70%;">
      <option value="regionsThenAuto">Regions, then full image if nothing found</option>
      <option value="regionsOnly">Regions only (no full-image fallback)</option>
      <option value="autoOnly">Full image only (ignore regions)</option>
    </select>
  </div>

  <div class="form-row">
    <label for="node-input-regionSource"><i class="fa fa-map-marker"></i> Regions from</label>
    <select id="node-input-regionSource" style="width:70%;">
      <option value="list">The list below</option>
      <option value="profile">The golden's profile (barcodes found on the artwork)</option>
    </select>
  </div>
  <div class="form-row node-input-profile-row">
    <label for="node-input-profilePath"><i class="fa fa-file-o"></i> Profile file</label>
    <input type="text" id="node-input-profilePath" placeholder="/data/golden/profiles/demo_good_60.json" />
  </div>
  <div class="form-row node-input-profile-row">
    <label for="node-input-profileDir"><i class="fa fa-folder-o"></i> Profile dir</label>
    <input type="text" id="node-input-profileDir" placeholder="/data/golden/profiles" />
  </div>
  <div class="form-row node-input-profile-row">
    <label for="node-input-scaleFilePath"><i class="fa fa-th"></i> Calibration</label>
    <input type="text" id="node-input-scaleFilePath" placeholder="only when the payload is NOT rectified" />
  </div>
  <div class="form-row node-input-profile-row">
    <label for="node-input-regionPad"><i class="fa fa-arrows-alt"></i> Region pad</label>
    <input type="text" id="node-input-regionPad" style="width:60px;" />
    <span style="margin:0 6px 0 4px;">of the longer edge, at least</span>
    <input type="text" id="node-input-regionPadMinPx" style="width:60px;" />
    <span class="node-input-hint" style="margin-left:6px; color:#999;">golden px - see Help</span>
  </div>
  <div class="form-row node-input-profile-row">
    <span class="node-input-hint" style="margin-left:110px; color:#999;">
      the file is <code>msg.result.profile.path</code> when golden-compare ran
      upstream, else <code>msg.profile</code> as a name in Profile dir, else
      Profile file. Regions come from the golden's profile;
      <code>msg.regions</code> still overrides.
    </span>
  </div>

  <div class="form-row node-input-region-container-row">
    <label><i class="fa fa-crop"></i> Regions</label>
    <span class="node-input-hint" style="color:#999;">
      pixel coordinates on the full-resolution image - find them with any
      image viewer (see Help). Scanned in order, fastest first; skipped
      entirely in "Full image only" mode.
    </span>
    <ol id="node-input-region-container" style="margin-top:8px;"></ol>
  </div>

  <div class="form-row">
    <label><i class="fa fa-list"></i> Formats</label>
  </div>
  <div class="form-row" style="margin-left:110px;">
    <input type="checkbox" id="node-input-Code128" style="width:auto;vertical-align:middle;" />
    <label for="node-input-Code128" style="width:auto;">Code128</label>
    <input type="checkbox" id="node-input-DataMatrix" style="width:auto;vertical-align:middle;margin-left:12px;" />
    <label for="node-input-DataMatrix" style="width:auto;">DataMatrix</label>
    <input type="checkbox" id="node-input-QRCode" style="width:auto;vertical-align:middle;margin-left:12px;" />
    <label for="node-input-QRCode" style="width:auto;">QRCode</label>
  </div>
  <div class="form-row" style="margin-left:110px;">
    <input type="checkbox" id="node-input-EAN13" style="width:auto;vertical-align:middle;" />
    <label for="node-input-EAN13" style="width:auto;">EAN13</label>
    <input type="checkbox" id="node-input-Code39" style="width:auto;vertical-align:middle;margin-left:12px;" />
    <label for="node-input-Code39" style="width:auto;">Code39</label>
    <input type="checkbox" id="node-input-ITF" style="width:auto;vertical-align:middle;margin-left:12px;" />
    <label for="node-input-ITF" style="width:auto;">ITF</label>
    <input type="checkbox" id="node-input-PDF417" style="width:auto;vertical-align:middle;margin-left:12px;" />
    <label for="node-input-PDF417" style="width:auto;">PDF417</label>
  </div>
  <div class="form-row" style="margin-left:110px;">
    <input type="checkbox" id="node-input-EAN8" style="width:auto;vertical-align:middle;" />
    <label for="node-input-EAN8" style="width:auto;">EAN8</label>
    <span class="node-input-hint" style="margin-left:10px; color:#999;"
      >off by default - short enough to have a real chance of misreading noise as a confident wrong result, see Help</span
    >
  </div>

  <div class="form-row">
    <label><i class="fa fa-cogs"></i> Reader</label>
  </div>
  <div class="form-row" style="margin-left:110px;">
    <input type="checkbox" id="node-input-tryHarder" style="width:auto;vertical-align:middle;" />
    <label for="node-input-tryHarder" style="width:auto;">try harder</label>
    <input type="checkbox" id="node-input-tryRotate" style="width:auto;vertical-align:middle;margin-left:12px;" />
    <label for="node-input-tryRotate" style="width:auto;">try rotate</label>
    <span class="node-input-hint" style="margin-left:10px; color:#999;"
      >both needed for full recall - see Help</span
    >
  </div>
</script>

<script type="text/html" data-help-name="barcode-locate">
  <p>
    Finds and decodes barcodes (1D and 2D) in an image using
    <a href="https://github.com/Sec-ant/zxing-wasm" target="_blank">zxing-wasm</a>
    - a WebAssembly build of the real <code>zxing-cpp</code> engine, not the
    much weaker pure-JS <code>@zxing/library</code> port
    <code>node-red-contrib-image-tools</code>'s Barcode Decoder uses. Genuine
    multi-symbol detection, rotation tolerance, and native DataMatrix
    support - no separate localization step needed to get a result out of
    it on a big photo.
  </p>

  <h3>Why regions</h3>
  <p>
    Scanning a whole multi-megapixel photo takes on the order of a second,
    mostly the detector's own search over the full frame. On a fixed camera
    rig - the same assumption <code>golden-compare</code> and
    <code>checkerboard-calibrate</code> already make - barcodes land in
    roughly the same place shot to shot, so telling this node where to look
    turns that into a handful of single-digit-millisecond crops instead
    (measured ~2-15ms per region vs ~1.4s for the same image scanned whole
    on a 4096x5500 test photo - roughly two orders of magnitude). Mode
    <i>"Regions, then full image if nothing found"</i> keeps the slower
    whole-image scan available as a safety net (label repositioned, a
    region mis-measured) without paying its cost on every normal run.
  </p>
  <p>
    Regions are plain pixel coordinates on the image at its native
    resolution - <code>x</code>/<code>y</code> is the top-left corner,
    <code>width</code>/<code>height</code> its size. Find them by opening a
    sample photo in any image viewer that shows a pixel-coordinate readout
    (or crop candidates and check the crop looks right) and reading off a
    box comfortably around the barcode, including its quiet-zone margin -
    tight crops with no margin can make the reader fail even though the
    barcode itself is perfectly legible. Re-measure regions if the camera,
    lens, or mounting changes.
  </p>

  <h3>Regions from the golden's profile</h3>
  <p>
    With <i>Regions from</i> set to <i>the golden's profile</i>, nobody
    measures regions. <code>golden-compare</code> keeps one
    <b>profile</b> file per golden (its <i>Profile directory</i>): the
    trained transform - where the artwork sits in the frame it inspects -
    and, with its <i>Barcode regions</i> option on, the barcodes it found
    on the artwork itself. This node reads both and maps each barcode's
    box from the artwork into the image it is given. A new product needs
    no new regions, and a moved camera needs only the transform retrained.
  </p>
  <p>The profile file is, first match wins:</p>
  <ol>
    <li><code>msg.result.profile.path</code> - what <code>golden-compare</code> resolved, when it ran upstream;</li>
    <li><code>msg.profile</code> - a profile <i>name</i> (never a path), looked up in <i>Profile dir</i>;</li>
    <li><i>Profile file</i> - a fixed file, for a rig that only ever runs one product.</li>
  </ol>
  <p><code>msg.regions</code> on the message still overrides all of it.</p>
  <p>Two wirings work:</p>
  <ul>
    <li>
      <b>A:</b> <code>golden-compare</code> &rarr; a change node that puts the
      <b>native camera frame</b> back on <code>msg.payload</code> &rarr; this
      node, which then takes <code>msg.result.profile.path</code> from the
      compare's result.
    </li>
    <li>
      <b>B:</b> a change node setting <code>msg.profile</code> on the native
      frame &rarr; this node, with <i>Profile dir</i> set to the compare's
      profile directory.
    </li>
  </ul>
  <p>
    <b>Decode the native camera frame, not the frame the compare saw.</b>
    The compare usually inspects a halved, rectified frame; at that
    resolution a typical Code128 is ~2.3 px per module. Measured on the
    demo rig (149 photos): regions decoded on the halved rectified frame
    read both codes in only 23/149 and returned one confidently wrong
    string; the same regions on the native 3000x3700 frame read the exact
    artwork text in 149/149 with no wrong reads, 152 ms median against
    385 ms for the whole frame. The node warns when the payload is no
    larger than the frame the compare was trained on.
  </p>
  <p>
    <b>Calibration</b> (<i>scaleFilePath</i>): set it <b>if and only if</b>
    the payload has <b>not</b> been through <code>perspective-rectify</code>
    but the compare's frame had - the node then undoes the rectification
    for the regions. A rectified payload with a calibration set is
    un-rectified twice and the regions land in the wrong place (warned when
    <code>msg.rectify</code> says so). A calibration of another aspect ratio
    than the payload gives no regions, with a warning; the full-image
    fallback still runs.
  </p>
  <p>
    <b>Region pad</b> grows each box on every side by
    <code>max(regionPad &times; its longer edge, regionPadMinPx)</code>, in
    the golden's working pixels. The proportional part covers the code's
    own quiet zone; the floor is what covers the part's movement, because a
    pad proportional to a small code cannot - a 50 px DataMatrix would get
    10 px while the compare passes parts 64 px off nominal. Set
    <i>regionPadMinPx</i> to at least the compare's larger position
    tolerance (<code>positionToleranceYPx</code>) plus its register slack.
  </p>
  <p>
    Profile problems never fail the message: a missing file, a profile with
    no barcodes yet, barcodes and transform from two different goldens, a
    profile for another golden than the one the compare just used, a
    transform trained before the frame size was recorded - each is warned
    once per profile file and leaves the message with no profile regions,
    so in the default mode the full-image scan still runs. A transform with
    no recorded placement is used as if the part sat centred, with a
    warning. Mapped regions are cached; a message costs one file stat.
  </p>

  <h3>Input</h3>
  <p>
    <code>msg.payload</code> - the image: Buffer / Uint8Array, a file path
    string, or an object with <code>data</code>/<code>buffer</code>/<code>path</code>.
    Bare pixels work as <code>golden-compare</code> takes them: an object
    <code>{ data, width, height, channels }</code>, or the bytes with
    <code>msg.rawInfo = { width, height, channels }</code>.
  </p>
  <p>
    Optional per-message overrides: <code>msg.regions</code> (array of
    <code>{ label, x, y, width, height }</code>, replaces the configured
    list - or the profile's regions - for this message),
    <code>msg.mode</code>, and <code>msg.profile</code> (a profile name, see
    above).
  </p>

  <h3>Output</h3>
  <p>One message per barcode found, in scan order (regions first, then the full-image fallback if it ran):</p>
  <ul>
    <li><code>msg.text</code> - the decoded content</li>
    <li><code>msg.format</code> - e.g. <code>"Code128"</code>, <code>"DataMatrix"</code></li>
    <li><code>msg.roi</code> - <code>{ x, y, width, height }</code> of the region scanned (full-image coordinates)</li>
    <li><code>msg.symbol</code> - <code>{ x, y, width, height }</code> of the code itself (full-image coordinates)</li>
    <li><code>msg.regionLabel</code> - the region's configured label, or <code>null</code> for a full-image find</li>
    <li><code>msg.regionSource</code> - where the regions came from: <code>"list"</code>, <code>"profile"</code> or <code>"msg"</code></li>
    <li>
      <code>msg.expectedText</code> - with profile regions, the text the
      golden's artwork has for the code in that place (<code>null</code>
      otherwise); <code>msg.textMatches</code> - whether
      <code>msg.text</code> equals it (<code>null</code> when there is
      nothing to compare). A mismatch is also warned, once per profile.
    </li>
    <li><code>msg.source</code> - <code>"region"</code> or <code>"fullImage"</code></li>
    <li><code>msg.decodeMs</code> - time for that specific region/scan (not the whole node's runtime)</li>
    <li><code>msg.timings</code> - <code>{ regionsMs, fullImageMs }</code>, whichever ran</li>
    <li><code>msg.payload</code> - a cropped preview image of that result's region</li>
  </ul>
  <p>
    If nothing is found anywhere, one message is sent with
    <code>msg.text = null</code>, <code>msg.barcodeCount = 0</code>, and
    <code>msg.symbol</code>, <code>msg.expectedText</code>,
    <code>msg.textMatches</code> all <code>null</code>.
  </p>
  <p>
    One code read through two overlapping regions is reported once, under
    the first region's label (same text, same format, touching boxes).
    Overlapping hand-drawn regions used to report it twice, so
    <code>msg.barcodeCount</code> can be lower than before.
  </p>

  <h3>Notes</h3>
  <p>
    <b>EAN8 is off by default.</b> It's short enough that ZXing
    implementations (both the JS port and, in testing against this
    project's own sample label, zxing-wasm itself) have a real chance of
    matching noise in a region/crop that has no barcode in it at all - a
    confident wrong answer, worse than "not found". Turn it on only if a
    real EAN-8 code is expected.
  </p>
  <p>
    <b>Try harder / try rotate</b> are both on by default and both matter:
    against this project's sample label, <code>tryHarder=false</code>
    missed most of the real barcodes, and <code>tryRotate=false</code>
    missed ones printed upside-down or rotated 90 degrees. Turning either
    off trades recall for speed.
  </p>
  <p>
    The first decode after Node-RED starts (or this flow redeploys) pays a
    one-time warmup cost for zxing-wasm's WASM module - handled internally
    so it doesn't land on whichever message happens to arrive first.
  </p>
  <p>
    <b>Works offline.</b> zxing-wasm on its own downloads its WASM binary
    from a CDN on the first decode after every start, which fails on a rig
    without internet; this node loads the binary shipped inside the package
    instead and never touches the network.
  </p>
</script>

<script type="text/javascript">
  RED.nodes.registerType("barcode-locate", {
    category: "vision",
    color: "#FFAAAA",
    defaults: {
      name: { value: "" },
      mode: { value: "regionsThenAuto" },
      regions: { value: [] },
      regionSource: { value: "list" },
      profilePath: { value: "" },
      profileDir: { value: "" },
      scaleFilePath: { value: "" },
      regionPad: { value: 0.2, validate: RED.validators.number(true) },
      regionPadMinPx: { value: 64, validate: RED.validators.number(true) },
      Code128: { value: true },
      DataMatrix: { value: true },
      QRCode: { value: true },
      EAN13: { value: true },
      Code39: { value: true },
      ITF: { value: true },
      PDF417: { value: true },
      EAN8: { value: false },
      tryHarder: { value: true },
      tryRotate: { value: true },
    },
    inputs: 1,
    outputs: 1,
    icon: "font-awesome/fa-barcode",
    label: function () {
      return this.name || "barcode locate";
    },
    paletteLabel: function () {
      return "barcode locate";
    },
    oneditprepare: function () {
      const list = $("#node-input-region-container")
        .css("min-height", "150px")
        .css("min-width", "450px")
        .editableList({
          addItem: function (container, index, region) {
            region.label = region.label || "";
            region.x = region.x || 0;
            region.y = region.y || 0;
            region.width = region.width || 0;
            region.height = region.height || 0;

            container.css({ overflow: "hidden", whiteSpace: "nowrap" });

            const row1 = $("<div/>", { style: "margin-bottom:4px;" }).appendTo(container);
            const labelInput = $("<input/>", {
              type: "text",
              style: "width:100%;",
              placeholder: "label (optional, e.g. \"main UDI barcode\")",
            })
              .appendTo(row1)
              .val(region.label);

            const row2 = $("<div/>").appendTo(container);
            function numField(placeholder, value) {
              return $("<input/>", {
                type: "number",
                style: "width:70px;margin-right:6px;",
                placeholder: placeholder,
              })
                .appendTo(row2)
                .val(value);
            }
            $("<span/>", { text: "x:", style: "margin-right:3px;" }).appendTo(row2);
            const xInput = numField("x", region.x);
            $("<span/>", { text: "y:", style: "margin-right:3px;" }).appendTo(row2);
            const yInput = numField("y", region.y);
            $("<span/>", { text: "w:", style: "margin-right:3px;" }).appendTo(row2);
            const wInput = numField("width", region.width);
            $("<span/>", { text: "h:", style: "margin-right:3px;" }).appendTo(row2);
            const hInput = numField("height", region.height);

            container.data("read", function () {
              return {
                label: labelInput.val(),
                x: parseInt(xInput.val(), 10) || 0,
                y: parseInt(yInput.val(), 10) || 0,
                width: parseInt(wInput.val(), 10) || 0,
                height: parseInt(hInput.val(), 10) || 0,
              };
            });
          },
          removable: true,
          sortable: true,
        });

      const regions = this.regions || [];
      for (let i = 0; i < regions.length; i++) {
        list.editableList("addItem", regions[i]);
      }

      // In profile mode the list is not used (msg.regions still is), so
      // hide it rather than let someone edit regions that are ignored. The
      // rows are kept, not cleared: switching back restores them.
      const source = $("#node-input-regionSource");
      function showSource() {
        const profile = source.val() === "profile";
        $(".node-input-region-container-row").toggle(!profile);
        $(".node-input-profile-row").toggle(profile);
      }
      source.on("change", showSource);
      showSource();
    },
    oneditsave: function () {
      const items = $("#node-input-region-container").editableList("items");
      const regions = [];
      items.each(function () {
        const read = $(this).data("read");
        if (read) regions.push(read());
      });
      this.regions = regions;
    },
  });
</script>
