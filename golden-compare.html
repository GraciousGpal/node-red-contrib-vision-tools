<script type="text/html" data-template-name="golden-compare">

    <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-input-name" placeholder="Name" />
  </div>
  <div class="form-row">
    <label for="node-input-goldenPath"
      ><i class="fa fa-image"></i> Golden image path</label
    >
    <input
      type="text"
      id="node-input-goldenPath"
      placeholder="/data/golden/reference.png (container path)"
    />
    <span class="node-input-hint" style="margin-left:10px; color:#999;"
      >or send <code>msg.golden</code> (path/Buffer) per message</span
    >
  </div>
  <div class="form-row">
    <label for="node-input-workingSize"
      ><i class="fa fa-arrows-alt"></i> Working size</label
    >
    <input
      type="number"
      id="node-input-workingSize"
      min="64"
      max="4096"
      style="width:90px;"
    />
    <span class="node-input-hint" style="margin-left:10px; color:#999;"
      >long edge, px - compare resolution, not the source resolution</span
    >
  </div>
  <div class="form-row">
    <label for="node-input-threshold"
      ><i class="fa fa-adjust"></i> Threshold</label
    >
    <input
      type="number"
      id="node-input-threshold"
      min="0"
      max="255"
      style="width:80px;"
    />
    <label for="node-input-alignSearch" style="margin-left:24px;"
      >Align search</label
    >
    <input
      type="number"
      id="node-input-alignSearch"
      min="0"
      max="200"
      style="width:70px;"
    />
    <span class="node-input-hint" style="margin-left:10px; color:#999;"
      >px, working resolution - extra translation slack</span
    >
  </div>
  <div class="form-row">
    <label for="node-input-thresholdMode"
      ><i class="fa fa-sliders"></i> Ink level</label
    >
    <select id="node-input-thresholdMode" style="width:150px;">
      <option value="fixed">Fixed level</option>
      <option value="otsu">Otsu (per image)</option>
      <option value="sauvola">Sauvola (per pixel)</option>
    </select>
    <label for="node-input-sauvolaRadius" style="margin-left:24px;"
      >Sauvola radius</label
    >
    <input
      type="number"
      id="node-input-sauvolaRadius"
      min="2"
      max="200"
      style="width:70px;"
    />
    <input
      type="number"
      id="node-input-sauvolaK"
      min="0.01"
      max="1"
      step="0.05"
      style="width:70px; margin-left:6px;"
    />
    <span class="node-input-hint" style="margin-left:10px; color:#999;"
      >otsu/sauvola re-derive the level per image, so exposure drift stops
      mattering; radius/k apply to sauvola only</span
    >
  </div>
  <div class="form-row">
    <label for="node-input-inkMargin"
      ><i class="fa fa-adjust"></i> Ink margin</label
    >
    <input
      type="number"
      id="node-input-inkMargin"
      min="0"
      max="128"
      style="width:70px;"
    />
    <span class="node-input-hint" style="margin-left:10px; color:#999;"
      >grey levels: pixels that cleared the ink level by less than this are ink
      for alignment but can't raise a defect - stops a screened tint that prints
      heavier than the artwork reporting itself as a blemish. 0 disables</span
    >
  </div>
  <div class="form-row">
    <label for="node-input-transformFilePath"
      ><i class="fa fa-crosshairs"></i> Trained transform</label
    >
    <input
      type="text"
      id="node-input-transformFilePath"
      placeholder="/data/golden/transform.json"
    />
  </div>
  <div class="form-row">
    <label for="node-input-nuisancePath"
      ><i class="fa fa-map-o"></i> Nuisance map</label
    >
    <input
      type="text"
      id="node-input-nuisancePath"
      placeholder="/data/golden/nuisance.json"
    />
  </div>
  <div class="form-row">
    <label for="node-input-noveltyThreshold">Novelty threshold</label>
    <input type="number" step="0.01" min="0" max="1" id="node-input-noveltyThreshold" />
    <span class="node-input-hint" style="margin-left:10px; color:#999;"
      >fail when a block exceeds its trained baseline by this much. 0 disables</span
    >
  </div>
  <div class="form-row">
    <label for="node-input-trainNuisance" style="width:auto;"
      ><input
        type="checkbox"
        id="node-input-trainNuisance"
        style="width:auto; vertical-align:top;"
      />
      Train the nuisance map from incoming frames</label
    >
    <span class="node-input-hint" style="margin-left:10px; color:#999;"
      >every frame must be known-good; the map is rewritten as each arrives, so

    >
  </div>
  <div class="form-row">
    <label for="node-input-trainTransform" style="width:auto;"
      ><input
        type="checkbox"
        id="node-input-trainTransform"
        style="width:auto; vertical-align:top;"
      />
      Train the transform from the next frame</label
    >
    <span class="node-input-hint" style="margin-left:10px; color:#999;"
      >measures magnification and press stretch once and writes them to the file

    >

  <div class="form-row">
    <label for="node-input-mismatchScore"

    >
    <input

  <div class="form-row">

<script type="text/html" data-help-name="golden-compare">
  <p>
    Golden-template AOI: a
    <b>position check</b> (deviation of a matched crop window from the center of
    the available margin, vs. a tolerance band - a real position defect fails on
    its own, it isn't silently corrected away) plus two independent
    <b>blemish checks</b> - print (golden has ink the target is missing) and
    background (target has ink the golden never has) - each with its own
    tolerance. Built for speed - the golden reference is decoded and
    preprocessed once and cached, not redone per frame; decode/resize uses
    <code>sharp</code> (native).
  </p>
  <p>
    The target is decoded preserving its own aspect ratio (never stretched to
    fit), then the golden is located within it - translation (bounded by the
    target's spare margin plus <i>Align search</i> px), magnification, stretch
    and angle, each within its configured search range - so a raw camera
    capture with extra background needs no manual crop step. The found
    transform is also what the position check measures.
  </p>

  <h3>Input</h3>
  <p><code>msg.payload</code> can be:</p>
  <ul>
    <li>a <b>Buffer</b> / Uint8Array with the image bytes</li>
    <li>a <b>string path</b> to an image file on the container's filesystem</li>
    <li>
      an object with <code>data</code> / <code>buffer</code> or
      <code>path</code>
    </li>
  </ul>
  <p>
    Optional per-message overrides: <code>msg.golden</code> (path or Buffer -
    swaps and re-caches the golden reference if it differs from what's cached),
    <code>msg.goldenKey</code> (names a golden so a Buffer is not re-hashed
    per frame), <code>msg.rawInfo</code> / <code>msg.goldenRawInfo</code>
    (<code>{ width, height, channels }</code> for raw pixels), and every
    setting above except <i>Working size</i>, <i>Novelty threshold</i> and
    the file paths, by the same name: <code>msg.threshold</code>,
    <code>msg.printTolerance</code>, <code>msg.heatmapFormat</code>
    (<code>jpg</code> / <code>png</code> / <code>raw</code>),
    <code>msg.trainTransform</code>, <code>msg.nativeAlignSeed</code>, and so
    on.
  </p>

  <h3>Output</h3>
  <ul>
    <li>
      <code>msg.payload</code> — <code>true</code>/<code>false</code> overall
      pass
    </li>
    <li>
      <code>msg.result</code> —
      <code
        >{ pass, position: { dxPx, dyPx, dxMm, dyMm, angleDeg, anglePass, scale,
        scaleX, scaleY, stretchPercent, pass }, transform: { pinned, native, nativeFallback?, seeded, pinRefused?, scaleX,
        scaleY, scale, stretchPercent, angleDeg, ox, oy, score }, match: {
        score, grade, coverage, labelMissing, mismatchSuspected, reason }, thresholds: { golden, target
        }, localAlign: { tiles, localised, meanPx, medianPx, maxPx },
        printBlemish: { pass, defectRatio, regions }, backgroundBlemish: { pass,
        defectRatio, regions, worstExcess, noveltyPass } }</code
      >
      (region coordinates in the working-resolution image, same size as the heat
      maps)
    </li>
    <li>
      <code>msg.printHeatmap</code> / <code>msg.backgroundHeatmap</code> — JPEG (or PNG / raw, per <i>Image format</i>)
      <code>Buffer</code> overlays (only if the matching
      <i>Output heat maps</i> checkbox is on)
    </li>
    <li>
      <code>msg.timings</code> —
      <code>{ decodeMs, alignMs, diffMs, heatmapMs, stagesMs, totalMs }</code>
    </li>
    <li>
      <code>msg.stages</code> — only if <i>Output pipeline stages</i> is on: image
      <code>Buffer</code>s for each pipeline step (<code>goldenGray</code>,
      <code>goldenFg</code>, <code>goldenFgDilatedBackground</code>,
      <code>targetGray</code>, <code>targetFg</code>,
      <code>targetGrayAligned</code>, <code>targetFgAligned</code>,
      <code>targetFgDilatedPrint</code>, <code>printDefect</code>,
      <code>backgroundDefect</code>)
    </li>
    <li>
      the node logs the same breakdown plus the position/print/background
      verdicts at info level
    </li>
  </ul>

  <h3>Calibration</h3>
  <p>
    <i>Scale file path</i> points at the JSON baseline written by
    <code>checkerboard-calibrate</code>. When set and the file exists, the
    position check converts the measured
    shift to mm (rescaled from the calibration photo's native resolution to this
    node's <i>Working size</i>) and checks it against the mm tolerances. Without
    it, the px tolerances are used instead - position is still checked, just not
    in physical units.
  </p>

  <h3>Notes</h3>
  <p>
    <i>Golden image path</i> is a path <b>inside the container</b> - use
    <code>/data</code> for anything that should survive a rebuild. The golden
    reference is only re-decoded when its source (path/Buffer fingerprint),
    <i>Working size</i>/<i>Threshold</i>/<i>Background tolerance</i>, or the
    calibrated scale changes - <i>Print tolerance</i>/<i>Align search</i>/etc.
    are applied fresh per frame and don't need a re-decode.
  </p>
  <p>
    <i>Native alignment seed</i> (off by default) lets the optional OpenCV
    engine propose the angle and placement that start the pinned search; the
    trained magnifications, the pixel polish and the score stay in JS, and
    without the engine or a trained transform the flag does nothing.
  </p>

  <h3>Preview</h3>
  <p>
    With <i>Preview</i> on, the node draws its last frame under itself on
    the flow canvas: the heat map of the channel that failed, or the
    aligned frame when nothing did, with the verdict and time. Click it to
    open the stage viewer, which steps through the whole inspection in the
    order it ran - the golden and its ink mask, the frame and its ink, the
    aligned frame, the two grown masks, each defect mask, both heat maps,
    and the trained nuisance baseline when a map is loaded - with what each
    stage means and the numbers behind the verdict. Arrow keys step,
    <kbd>Esc</kbd> closes, and clicking the picture toggles 1:1.
    <i>Overlay on the golden</i> (or <kbd>o</kbd>) lays the stage over a
    golden-side image - the ink masks over the golden's ink, everything
    else over the grey golden, or pick one - as red/cyan (red: only the
    golden has it, cyan: only this stage has it, white: both, so a print
    defect is red and a background defect is cyan), as a difference, or as
    a blend with a slider. The viewer follows each new frame the node
    inspects; <i>Pause</i> (or <kbd>p</kbd>) holds the one on screen - the
    runtime keeps it until you resume or close, so later frames cannot
    replace it while you look.
  </p>
  <p>
    The node keeps one inspection per golden-compare node in memory for
    this - every stage at working size - and serves it over
    <code>GET /golden-compare/last/:id</code> (the verdict and the stage
    list) and <code>GET /golden-compare/last/:id/stage/:key</code> (one
    image). It survives a redeploy, not a restart. The preview renders every
    stage on every frame, the cost of <i>Output pipeline stages</i>, so it
    is for tuning rather than production; <code>msg.previewEnabled</code>
    overrides it per message.
  </p>
</script>

<script type="text/javascript">
  RED.nodes.registerType("golden-compare", {
    category: "vision",
    color: "#B7950B",
    defaults: {
      // number(true) = blank allowed. Node-RED does not backfill new
      // defaults into node instances that were saved before the property
      // existed, so a strict validator marks every such node "invalid
      // properties" the moment a setting is added. The runtime clamps a
      // missing or blank value to the same default anyway, so accepting
      // blank here is both safe and what the user means by it.
      name: { value: "" },
      goldenPath: { value: "" },
      workingSize: { value: 1024, validate: RED.validators.number(true) },
      threshold: { value: 128, validate: RED.validators.number(true) },
      thresholdMode: { value: "otsu" },
      sauvolaRadius: { value: 24, validate: RED.validators.number(true) },
      sauvolaK: { value: 0.2, validate: RED.validators.number(true) },
      inkMargin: { value: 8, validate: RED.validators.number(true) },
      alignCandidates: { value: 5, validate: RED.validators.number(true) },
      workers: { value: 0, validate: RED.validators.number(true) },
      nativeFastAlign: { value: false },
      nativeAlignSeed: { value: false },
      mismatchScore: { value: 0.15, validate: RED.validators.number(true) },
      minCoverage: { value: 0.5, validate: RED.validators.number(true) },
      localAlign: { value: true },
      localAlignTile: { value: 96, validate: RED.validators.number(true) },
      localAlignMax: { value: 3, validate: RED.validators.number(true) },
      transformFilePath: { value: "" },
      trainTransform: { value: false },
      // A real default, not just a placeholder: ticking "Train the nuisance
      // map" with this empty used to deploy cleanly and then throw on every
      // frame, because a grey placeholder reads like a filled-in value.
      nuisancePath: {
        value: "/data/golden/nuisance.json",
        // Training with nowhere to write is the case that failed silently at
        // deploy time. Flag it in the editor instead.
        validate: function (v) {
          // `this` is the node under validation. Node-RED does not
          // guarantee it on every call path, so an unknown state is
          // treated as valid rather than blocking a deploy wrongly.
          var training = this && this.trainNuisance;
          return !training || String(v == null ? "" : v).trim() !== "";
        },
      },
      trainNuisance: { value: false },
      noveltyThreshold: { value: 0.3, validate: RED.validators.number(true) },
      scaleSearchMin: { value: 0.6, validate: RED.validators.number(true) },
      scaleSearchMax: { value: 2.5, validate: RED.validators.number(true) },
      scaleSearchSteps: { value: 37, validate: RED.validators.number(true) },
      maxAspect: { value: 0.06, validate: RED.validators.number(true) },
      aspectSteps: { value: 7, validate: RED.validators.number(true) },
      maxAngleDeg: { value: 2, validate: RED.validators.number(true) },
      angleSteps: { value: 5, validate: RED.validators.number(true) },
      positionToleranceAngleDeg: {
        value: 1,
        validate: RED.validators.number(true),
      },
      printTolerance: { value: 2, validate: RED.validators.number(true) },
      backgroundTolerance: { value: 1, validate: RED.validators.number(true) },
      alignSearch: { value: 16, validate: RED.validators.number(true) },
      scaleFilePath: { value: "" },
      positionToleranceXMm: { value: 2, validate: RED.validators.number(true) },
      positionToleranceYMm: { value: 2, validate: RED.validators.number(true) },
      positionToleranceXPx: {
        value: 16,
        validate: RED.validators.number(true),
      },
      positionToleranceYPx: {
        value: 16,
        validate: RED.validators.number(true),
      },
      blockSize: { value: 16, validate: RED.validators.number(true) },
      blockThreshold: { value: 0.15, validate: RED.validators.number(true) },
      failThreshold: { value: 0.3, validate: RED.validators.number(true) },
      failRatio: { value: 0.002, validate: RED.validators.number(true) },
      outputPrintHeatmap: { value: true },
      outputBackgroundHeatmap: { value: true },
      heatmapFormat: { value: "jpg" },
      heatmapQuality: { value: 85, validate: RED.validators.number(true) },
      debugStages: { value: false },
      previewEnabled: { value: false },
      previewWidth: { value: 260, validate: RED.validators.number(true) },
    },
    inputs: 1,
    outputs: 1,
    icon: "golden-compare.svg",
    label: function () {
      return this.name || "golden compare";
    },
    paletteLabel: function () {
      return "golden compare";
    },
    oneditprepare: function () {
      // preview width only means anything when the preview is on
      const previewCheckbox = document.getElementById("node-input-previewEnabled");
      const previewWidthRow = document.getElementById("golden-compare-preview-width-row");
      const updatePreviewVisibility = function () {
        previewWidthRow.style.display = previewCheckbox.checked ? "" : "none";
      };
      previewCheckbox.addEventListener("change", updatePreviewVisibility);
      updatePreviewVisibility();
    },
  });

  // The flow-canvas preview and the stage viewer behind it. Guarded so a
  // palette reload does not stack a second subscriber; one per editor.
  if (!window.goldenComparePreviewRendererInitialized) {
    window.goldenComparePreviewRendererInitialized = true;

    const XHTML = "http://www.w3.org/1999/xhtml";
    const el = function (tag, style, text) {
      const e = document.createElementNS(XHTML, tag);
      if (style) {
        for (const k in style) e.style[k] = style[k];
      }
      if (text != null) e.textContent = text;
      return e;
    };

    const removePreview = function (nodeId) {
      const existing = document.getElementById(
        "golden-compare-preview-container-" + nodeId,
      );
      if (existing) existing.remove();
    };

    // ---- the stage viewer ------------------------------------------------

    let viewer = null;

    const closeViewer = function (reopening) {
      if (!viewer) return;
      document.removeEventListener("keydown", viewer.onKey);
      viewer.root.remove();
      if (viewer.paused && !reopening) releaseHold(viewer.nodeId);
      viewer = null;
    };

    const ajax = function (opts) {
      if (typeof $ === "undefined" || !$ || typeof $.ajax !== "function") return null;
      return $.ajax(opts);
    };
    const holdUrl = function (nodeId) {
      return "golden-compare/last/" + nodeId + "/hold";
    };
    const releaseHold = function (nodeId) {
      ajax({ url: holdUrl(nodeId), type: "DELETE" });
    };

    const fmt = function (v, digits) {
      return typeof v === "number" && isFinite(v) ? v.toFixed(digits) : "-";
    };

    // The verdict's numbers as label/value rows, in the order the
    // pipeline settles them, so a fail can be read down to its cause.
    const resultRows = function (meta) {
      const r = meta.result || {};
      const m = r.match || {};
      const p = r.position || {};
      const t = r.transform || {};
      const pb = r.printBlemish || {};
      const bb = r.backgroundBlemish || {};
      const tm = meta.timings || {};
      const rows = [
        ["verdict", meta.pass ? "pass" : "FAIL"],
        ["alignment", fmt(m.score, 4) + (m.grade ? " (" + m.grade + ")" : "")],
        ["coverage", typeof m.coverage === "number" ? Math.round(m.coverage * 100) + "% of golden ink" : "-"],
      ];
      if (m.reason) rows.push(["note", m.reason]);
      rows.push(
        [
          "position",
          (p.pass ? "ok" : "FAIL") +
            (p.dxMm != null
              ? " · dx " + fmt(p.dxMm, 2) + "mm dy " + fmt(p.dyMm, 2) + "mm"
              : " · dx " + p.dxPx + "px dy " + p.dyPx + "px") +
            " · " + fmt(p.angleDeg, 2) + "°",
        ],
        [
          "transform",
          "scale " + fmt(t.scale, 4) + " · stretch " + fmt(t.stretchPercent, 2) + "% · " +
            (t.pinned ? "pinned" : "searched") + (t.native ? " · native" : ""),
        ],
        [
          "print",
          (pb.pass ? "ok" : "FAIL") + " · ratio " + fmt(pb.defectRatio, 5) +
            " · " + ((pb.regions || []).length) + " region(s)" +
            ((pb.regions || []).length ? " · worst " + fmt(pb.regions[0].density, 3) : ""),
        ],
        [
          "background",
          (bb.pass ? "ok" : "FAIL") + " · ratio " + fmt(bb.defectRatio, 5) +
            " · " + ((bb.regions || []).length) + " region(s)" +
            ((bb.regions || []).length ? " · worst " + fmt(bb.regions[0].density, 3) : "") +
            (typeof bb.worstExcess === "number" && bb.worstExcess > 0
              ? " · excess " + fmt(bb.worstExcess, 3) + (bb.noveltyPass ? "" : " FAIL")
              : ""),
        ],
        [
          "time",
          (tm.totalMs != null ? tm.totalMs + "ms" : "-") +
            (tm.alignMs != null ? " · align " + tm.alignMs + "ms" : "") +
            (tm.diffMs != null ? " · diff " + tm.diffMs + "ms" : ""),
        ],
      );
      return rows;
    };

    const stageUrl = function (nodeId, key, receivedAt) {
      return "golden-compare/last/" + nodeId + "/stage/" + key + "?t=" + receivedAt;
    };

    const openViewer = function (nodeId, meta, state) {
      // with a state this is a refresh of the open viewer, which keeps its
      // hold; without one it is a fresh open, which lets any hold go
      closeViewer(!!state);
      state = state || {};
      const stages = Array.isArray(meta.stages) ? meta.stages : [];
      if (!stages.length) return;
      const node = RED.nodes.node(nodeId) || {};
      const name = node.name || "golden compare";

      const root = el("div", {
        position: "fixed", left: "0", top: "0", right: "0", bottom: "0",
        zIndex: "2000", background: "rgba(0,0,0,0.88)", color: "#eee",
        font: "13px sans-serif", display: "flex", flexDirection: "column",
      });
      root.id = "golden-compare-stage-viewer";

      // header: name, verdict, close
      const header = el("div", {
        display: "flex", alignItems: "center", padding: "10px 16px",
        borderBottom: "1px solid #444", flex: "0 0 auto",
      });
      header.appendChild(el("div", { fontWeight: "bold", marginRight: "16px" }, name));
      const verdict = el("div", {
        padding: "2px 8px", borderRadius: "3px", marginRight: "16px",
        background: meta.pass ? "#2e7d32" : "#c62828", color: "#fff",
      }, meta.text || (meta.pass ? "pass" : "fail"));
      header.appendChild(verdict);
      if (meta.filename) header.appendChild(el("div", { color: "#aaa", marginRight: "16px" }, meta.filename));
      header.appendChild(el("div", { color: "#aaa", flex: "1" },
        meta.receivedAt ? new Date(meta.receivedAt).toLocaleString() : ""));
      // Live: the viewer follows every frame the node inspects. Paused:
      // the runtime holds this one so the next frame cannot replace it.
      let paused = !!state.paused || !!meta.held;
      const liveTag = el("div", { marginRight: "10px", fontSize: "11px" });
      header.appendChild(liveTag);
      const pauseBtn = el("div", {
        cursor: "pointer", padding: "2px 10px", border: "1px solid #666",
        borderRadius: "3px", marginRight: "14px", userSelect: "none",
      });
      pauseBtn.id = "golden-compare-stage-pause";
      pauseBtn.title = "pause on this frame (p)";
      header.appendChild(pauseBtn);
      const syncPause = function () {
        pauseBtn.textContent = paused ? "▶ Resume" : "⏸ Pause";
        pauseBtn.style.background = paused ? "#b26a00" : "transparent";
        liveTag.textContent = paused ? "paused on this frame" : "live · follows each frame";
        liveTag.style.color = paused ? "#ffcc80" : "#8bc34a";
        if (viewer) viewer.paused = paused;
      };
      const setPaused = function (on) {
        if (on === paused) return;
        if (on) {
          const req = ajax({
            url: holdUrl(nodeId), type: "POST", contentType: "application/json",
            data: JSON.stringify({ receivedAt: meta.receivedAt }),
          });
          if (!req) return;
          req.done(function () {
            paused = true;
            syncPause();
          }).fail(function (xhr) {
            const err = xhr && xhr.responseJSON && xhr.responseJSON.error;
            if (RED.notify) RED.notify("golden-compare: " + (err || "could not pause") + " - showing the latest", "warning");
            refresh();
          });
        } else {
          paused = false;
          syncPause();
          releaseHold(nodeId);
          refresh();
        }
      };
      pauseBtn.onclick = function () { setPaused(!paused); };
      const close = el("div", { cursor: "pointer", fontSize: "22px", lineHeight: "1", padding: "0 4px" }, "×");
      close.title = "close (Esc)";
      close.onclick = closeViewer;
      header.appendChild(close);
      root.appendChild(header);

      // body: picture on the left, stages and numbers on the right
      const body = el("div", { display: "flex", flex: "1 1 auto", minHeight: "0" });
      const stage = el("div", {
        flex: "1 1 auto", display: "flex", alignItems: "center", justifyContent: "center",
        overflow: "auto", minWidth: "0", cursor: "zoom-in",
      });
      const img = el("img", { maxWidth: "100%", maxHeight: "100%", objectFit: "contain", background: "#222" });
      img.alt = "";
      stage.appendChild(img);
      // the overlay is composited here; only one of img/canvas shows
      const canvas = el("canvas", { maxWidth: "100%", maxHeight: "100%", objectFit: "contain", background: "#222", display: "none" });
      stage.appendChild(canvas);
      body.appendChild(stage);

      // The verdict's numbers stay put at the top; the stage list, the
      // overlay controls and the description scroll under them.
      const side = el("div", {
        flex: "0 0 300px", borderLeft: "1px solid #444", overflow: "hidden",
        display: "flex", flexDirection: "column", minHeight: "0",
      });
      side.id = "golden-compare-stage-side";
      const scroller = el("div", { flex: "1 1 auto", overflow: "auto", minHeight: "0", padding: "4px 12px 10px" });
      const list = el("div", { flex: "0 0 auto" });
      const buttons = [];
      let lastGroup = null;
      stages.forEach(function (s, i) {
        if (s.group !== lastGroup) {
          lastGroup = s.group;
          list.appendChild(el("div", {
            color: "#999", textTransform: "uppercase", fontSize: "10px",
            letterSpacing: "1px", margin: "8px 0 3px",
          }, s.group));
        }
        const b = el("div", {
          padding: "4px 8px", borderRadius: "3px", cursor: "pointer", marginBottom: "1px",
        }, (i + 1) + ". " + s.title);
        b.onclick = function () { show(i); };
        buttons.push(b);
        list.appendChild(b);
      });
      scroller.appendChild(list);

      // ---- overlay: this stage composited over a golden-side image ----
      const goldenSide = stages.filter(function (s) { return s.group === "golden"; });
      const overlay = state.overlay
        ? { on: !!state.overlay.on, mode: state.overlay.mode || "redcyan", base: state.overlay.base || null, opacity: state.overlay.opacity != null ? state.overlay.opacity : 0.5 }
        : { on: false, mode: "redcyan", base: null, opacity: 0.5 };
      const overlayBox = el("div", {
        margin: "12px 0 0", paddingTop: "10px", borderTop: "1px solid #444", fontSize: "12px",
      });
      const overlayRow = el("label", { display: "flex", alignItems: "center", cursor: "pointer" });
      const overlayCheck = el("input");
      overlayCheck.type = "checkbox";
      overlayCheck.id = "golden-compare-stage-overlay";
      overlayCheck.style.margin = "0 6px 0 0";
      overlayRow.appendChild(overlayCheck);
      overlayRow.appendChild(el("span", null, "Overlay on the golden (o)"));
      overlayBox.appendChild(overlayRow);
      const overlayOpts = el("div", { display: "none", margin: "6px 0 0 20px", lineHeight: "1.9" });
      const baseSelect = el("select", { marginLeft: "4px", maxWidth: "200px" });
      goldenSide.forEach(function (g) {
        const o = el("option", null, g.title);
        o.value = g.key;
        baseSelect.appendChild(o);
      });
      const baseRow = el("div");
      baseRow.appendChild(el("span", { color: "#999" }, "under"));
      baseRow.appendChild(baseSelect);
      overlayOpts.appendChild(baseRow);
      const modeSelect = el("select", { marginLeft: "4px" });
      [["redcyan", "red / cyan"], ["difference", "difference"], ["blend", "blend"]].forEach(function (m) {
        const o = el("option", null, m[1]);
        o.value = m[0];
        modeSelect.appendChild(o);
      });
      const modeRow = el("div");
      modeRow.appendChild(el("span", { color: "#999" }, "as"));
      modeRow.appendChild(modeSelect);
      const opacity = el("input", { verticalAlign: "middle", marginLeft: "8px", width: "90px", display: "none" });
      opacity.type = "range";
      opacity.min = "0";
      opacity.max = "100";
      opacity.value = "50";
      modeRow.appendChild(opacity);
      overlayOpts.appendChild(modeRow);
      const overlayNote = el("div", { color: "#999", lineHeight: "1.4", marginTop: "4px" });
      overlayOpts.appendChild(overlayNote);
      overlayBox.appendChild(overlayOpts);
      if (goldenSide.length) scroller.appendChild(overlayBox);

      const MODE_NOTES = {
        redcyan: "Red: only the golden has it. Cyan: only this stage has it. White or grey: both. On the ink masks that is print defect in red and background defect in cyan; on the grey images a misregistration shows as coloured fringes.",
        difference: "Bright where the two differ, black where they agree.",
        blend: "The two mixed; drag to fade between the golden and this stage.",
      };
      const baseFor = function (key) {
        // masks over the golden's ink, greys and heat maps over the grey golden
        const wantMask = /Fg|Defect/.test(key);
        const pick = goldenSide.find(function (g) { return wantMask ? g.key === "goldenFg" : g.key === "goldenGray"; });
        return (pick || goldenSide[0]).key;
      };
      let baseChosen = !!state.baseChosen;
      if (baseChosen && overlay.base) baseSelect.value = overlay.base;
      opacity.value = String(Math.round(overlay.opacity * 100));
      const syncOverlayUi = function () {
        overlayCheck.checked = overlay.on;
        overlayOpts.style.display = overlay.on ? "" : "none";
        modeSelect.value = overlay.mode;
        opacity.style.display = overlay.mode === "blend" ? "" : "none";
        overlayNote.textContent = overlay.on ? MODE_NOTES[overlay.mode] : "";
      };
      overlayCheck.onchange = function () {
        overlay.on = !!overlayCheck.checked;
        syncOverlayUi();
        render();
      };
      baseSelect.onchange = function () {
        baseChosen = true;
        overlay.base = baseSelect.value;
        render();
      };
      modeSelect.onchange = function () {
        overlay.mode = modeSelect.value;
        syncOverlayUi();
        render();
      };
      opacity.oninput = function () {
        overlay.opacity = Number(opacity.value) / 100;
        render();
      };
      overlayCheck.onclick = function (ev) { if (ev && ev.stopPropagation) ev.stopPropagation(); };

      // Loaded stage images by key, shared by the overlay and the prefetch.
      const loaded = {};
      const loadImage = function (key, cb) {
        const have = loaded[key];
        if (have && have.done) { cb(have.img); return; }
        if (have) { have.waiting.push(cb); return; }
        const entry = { img: new Image(), done: false, waiting: [cb] };
        loaded[key] = entry;
        entry.img.onload = function () {
          entry.done = true;
          entry.waiting.forEach(function (fn) { fn(entry.img); });
          entry.waiting = [];
        };
        entry.img.src = stageUrl(nodeId, key, meta.receivedAt);
      };
      const grayOf = function (data, w, h) {
        const c = document.createElementNS(XHTML, "canvas");
        c.width = w;
        c.height = h;
        const ctx = c.getContext("2d");
        ctx.drawImage(data, 0, 0);
        return ctx.getImageData(0, 0, w, h).data;
      };
      let renderSerial = 0;
      const render = function () {
        const s = stages[current];
        const showPlain = function (note) {
          img.style.display = "";
          canvas.style.display = "none";
          if (note != null) overlayNote.textContent = note;
        };
        if (!overlay.on || !s || !goldenSide.length) { showPlain(); return; }
        const baseKey = baseChosen ? overlay.base : baseFor(s.key);
        if (!baseChosen) baseSelect.value = baseKey;
        const serial = ++renderSerial;
        loadImage(baseKey, function (baseImg) {
          loadImage(s.key, function (stageImg) {
            if (serial !== renderSerial) return;
            const w = baseImg.naturalWidth || baseImg.width;
            const h = baseImg.naturalHeight || baseImg.height;
            const sw = stageImg.naturalWidth || stageImg.width;
            const sh = stageImg.naturalHeight || stageImg.height;
            if (w !== sw || h !== sh) {
              showPlain("This stage is on the frame's own canvas (" + sw + "×" + sh + "), not the golden's (" + w + "×" + h + "), so there is nothing to lay it over. Step on to the aligned frame.");
              return;
            }
            const a = grayOf(baseImg, w, h);
            const b = grayOf(stageImg, w, h);
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext("2d");
            const out = ctx.createImageData(w, h);
            const d = out.data;
            const mode = overlay.mode;
            const alpha = overlay.opacity;
            for (let i = 0; i < d.length; i += 4) {
              const ga = (a[i] + a[i + 1] + a[i + 2]) / 3;
              const gb = (b[i] + b[i + 1] + b[i + 2]) / 3;
              if (mode === "redcyan") {
                d[i] = ga;
                d[i + 1] = gb;
                d[i + 2] = gb;
              } else if (mode === "difference") {
                const diff = Math.abs(ga - gb);
                d[i] = diff;
                d[i + 1] = diff;
                d[i + 2] = diff;
              } else {
                d[i] = a[i] * (1 - alpha) + b[i] * alpha;
                d[i + 1] = a[i + 1] * (1 - alpha) + b[i + 1] * alpha;
                d[i + 2] = a[i + 2] * (1 - alpha) + b[i + 2] * alpha;
              }
              d[i + 3] = 255;
            }
            ctx.putImageData(out, 0, 0);
            img.style.display = "none";
            canvas.style.display = "";
            overlayNote.textContent = MODE_NOTES[mode];
          });
        });
      };

      const description = el("div", {
        color: "#ccc", lineHeight: "1.4", margin: "12px 0", flex: "0 0 auto",
        paddingTop: "10px", borderTop: "1px solid #444",
      });
      scroller.appendChild(description);
      const table = el("div", {
        fontSize: "12px", flex: "0 0 auto", padding: "10px 12px", borderBottom: "1px solid #444",
        background: "rgba(0,0,0,0.35)",
      });
      table.id = "golden-compare-stage-results";
      resultRows(meta).forEach(function (row) {
        const line = el("div", { display: "flex", marginBottom: "3px" });
        line.appendChild(el("div", { flex: "0 0 80px", color: "#999" }, row[0]));
        line.appendChild(el("div", { flex: "1", color: /FAIL/.test(row[1]) ? "#ef9a9a" : "#eee" }, row[1]));
        table.appendChild(line);
      });
      side.appendChild(table);
      side.appendChild(scroller);
      body.appendChild(side);
      root.appendChild(body);

      // footer: step controls
      const footer = el("div", {
        display: "flex", alignItems: "center", justifyContent: "center",
        padding: "8px", borderTop: "1px solid #444", flex: "0 0 auto",
      });
      const prev = el("div", { cursor: "pointer", padding: "2px 14px", fontSize: "18px" }, "‹");
      const counter = el("div", { minWidth: "260px", textAlign: "center" });
      const next = el("div", { cursor: "pointer", padding: "2px 14px", fontSize: "18px" }, "›");
      prev.onclick = function () { show(current - 1); };
      next.onclick = function () { show(current + 1); };
      footer.appendChild(prev);
      footer.appendChild(counter);
      footer.appendChild(next);
      footer.appendChild(el("div", { color: "#777", marginLeft: "24px", fontSize: "11px" },
        "← → step · o overlay · p pause · click picture for 1:1 · Esc closes"));
      root.appendChild(footer);

      let current = -1;
      let actual = !!state.actual;
      // what a refresh carries over to the viewer it opens on the new frame
      const snapshot = function () {
        return { current, actual, overlay: overlay, baseChosen, paused };
      };
      const refresh = function () {
        if (typeof $ === "undefined" || !$ || typeof $.getJSON !== "function") return;
        $.getJSON("golden-compare/last/" + nodeId).done(function (m) {
          openViewer(nodeId, m, snapshot());
        });
      };
      const applyZoom = function () {
        img.style.maxWidth = actual ? "none" : "100%";
        img.style.maxHeight = actual ? "none" : "100%";
        canvas.style.maxWidth = actual ? "none" : "100%";
        canvas.style.maxHeight = actual ? "none" : "100%";
        stage.style.cursor = actual ? "zoom-out" : "zoom-in";
        stage.style.justifyContent = actual ? "flex-start" : "center";
        stage.style.alignItems = actual ? "flex-start" : "center";
      };
      stage.onclick = function () {
        actual = !actual;
        applyZoom();
      };
      const show = function (i) {
        if (!stages.length) return;
        i = ((i % stages.length) + stages.length) % stages.length;
        if (i === current) return;
        current = i;
        const s = stages[i];
        img.src = stageUrl(nodeId, s.key, meta.receivedAt);
        buttons.forEach(function (b, j) {
          b.style.background = j === i ? "#1976d2" : "transparent";
          b.style.color = j === i ? "#fff" : "#ddd";
        });
        description.textContent = s.description || "";
        counter.textContent = (i + 1) + " / " + stages.length + " · " + s.title;
        render();
        // the next one is what an arrow key asks for; have it ready
        const n = stages[(i + 1) % stages.length];
        loadImage(n.key, function () {});
      };
      const onKey = function (ev) {
        if (ev.key === "ArrowRight" || ev.key === "ArrowDown" || ev.key === " ") {
          show(current + 1);
        } else if (ev.key === "ArrowLeft" || ev.key === "ArrowUp") {
          show(current - 1);
        } else if (ev.key === "Escape") {
          closeViewer();
        } else if (ev.key === "Home") {
          show(0);
        } else if (ev.key === "End") {
          show(stages.length - 1);
        } else if (ev.key === "o" || ev.key === "O") {
          if (!goldenSide.length) return;
          overlay.on = !overlay.on;
          syncOverlayUi();
          render();
        } else if (ev.key === "p" || ev.key === "P") {
          setPaused(!paused);
        } else {
          return;
        }
        if (ev.preventDefault) ev.preventDefault();
      };
      document.addEventListener("keydown", onKey);
      root.onclick = function (ev) {
        if (ev.target === root) closeViewer();
      };
      document.body.appendChild(root);
      viewer = { root, onKey, show, nodeId, receivedAt: meta.receivedAt, paused, refresh };
      syncPause();
      syncOverlayUi();
      applyZoom();
      show(state.current != null ? Math.min(state.current, stages.length - 1) : 0);
    };

    // Fetch the last inspection and open on it. The thumbnail carries the
    // stage keys, but the viewer asks the runtime again so it opens on
    // whatever frame is current, not the one the thumbnail was drawn for.
    const openLast = function (nodeId) {
      if (typeof $ === "undefined" || !$ || typeof $.getJSON !== "function") return;
      $.getJSON("golden-compare/last/" + nodeId)
        .done(function (meta) {
          openViewer(nodeId, meta);
        })
        .fail(function (xhr) {
          const err = xhr && xhr.responseJSON && xhr.responseJSON.error;
          if (RED.notify) {
            RED.notify("golden-compare: " + (err || "could not load the last inspection"), "warning");
          }
        });
    };

    // ---- the thumbnail under the node ------------------------------------

    RED.comms.subscribe("golden-compare-preview", function (_event, data) {
      if (!data || !data.id) return;
      // an open viewer follows the node's frames unless it is paused
      if (
        viewer && viewer.nodeId === data.id && !viewer.paused &&
        !data.clear && data.receivedAt && data.receivedAt !== viewer.receivedAt
      ) {
        viewer.refresh();
      }
      if (data.clear || !data.image) {
        removePreview(data.id);
        return;
      }
      const nodeElement = document.getElementById(data.id);
      if (!nodeElement) return;
      removePreview(data.id);

      const width = Number(data.previewWidth) || 260;
      const scale = width / (data.imageWidth || width);
      const height = Math.round((data.imageHeight || width) * scale);

      // The foreignObject lives inside the node's own <g>, whose origin is
      // the node's top-left corner: centre it on the node's width and start
      // it a little below the node's height.
      const node = RED.nodes.node(data.id) || {};
      const panelWidth = width + 20;
      const container = document.createElementNS(
        "http://www.w3.org/2000/svg",
        "foreignObject",
      );
      container.id = "golden-compare-preview-container-" + data.id;
      container.setAttribute("x", String((node.w || 0) / 2 - panelWidth / 2));
      container.setAttribute("y", String((node.h || 0) + 10));
      container.setAttribute("width", String(panelWidth));
      container.setAttribute("height", String(height + 46));
      container.style.overflow = "visible";

      const panel = el("div", {
        padding: "5px", background: "rgba(32, 32, 32, 0.9)", borderRadius: "4px",
        color: "white", font: "11px sans-serif", cursor: "pointer",
      });
      panel.title = "click to step through the inspection";
      panel.onclick = function () {
        openLast(data.id);
      };

      const caption = el("div", { paddingBottom: "3px", display: "flex", alignItems: "center" });
      const text = el("div", {
        flex: "1", textAlign: "center", whiteSpace: "nowrap", overflow: "hidden",
        textOverflow: "ellipsis",
        color: data.pass ? "#a5d6a7" : data.labelMissing || data.mismatchSuspected ? "#ffcc80" : "#ef9a9a",
      }, data.text || (data.pass ? "pass" : "fail"));
      caption.appendChild(text);
      const hide = el("div", { color: "#999", marginLeft: "6px", padding: "0 3px" }, "×");
      hide.title = "hide";
      hide.onclick = function (ev) {
        if (ev && ev.stopPropagation) ev.stopPropagation();
        removePreview(data.id);
      };
      caption.appendChild(hide);
      panel.appendChild(caption);

      const img = el("img", { display: "block", width: width + "px", height: height + "px" });
      img.src = "data:image/" + (data.mimeType || "jpeg") + ";base64," + data.image;
      panel.appendChild(img);

      container.appendChild(panel);
      nodeElement.appendChild(container);
    });
  }
</script>
